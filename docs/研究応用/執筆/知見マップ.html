  <p class="lead">学習の実験で、いま何が言えて何が言えないか。1 行目は問いと答えだけ。気になったら押すと開き、数値は図で見る。</p>
  <div class="keys" id="keys"></div>
  <p class="src">今の物理（実在の値で取り直した結果）、2026-11-25 時点の写し。数値の正は <span class="num">docs/研究応用/執筆/知見総括表.md</span> と実験系譜。</p>

<section id="sec-F"><h2>図</h2><p class="sub">点 = seed 1 本の best、帯 = その範囲。点に触れると値が出る。</p><div class="figs" id="figs"></div></section>
</div>

<script>
/* ---------- 用語 ---------- */
const G={
 "R":"到達（Reach）。腕の先端を目標（x 0.8 m）へ運んで止める。",
 "P":"押し（Pusher）。箱を +x へ押す。",
 "s":"seed（乱数の種）。3 s は種を変えて 3 回学習したということ。",
 "帯":"seed ごとの best を並べた最小〜最大の範囲。2 つの帯が重ならないときだけ順位を言う。seed を足すと重なることはある。",
 "best":"学習の途中でいちばん良かった 1 話の報酬。R は 0 に近いほど良い（−1.85 ≒ 平均 1.85 mm 離れていた）。P は大きいほど良い（箱を遠くへ押した）。",
 "凍結":"形の更新の歩幅を 1/10000 にして、形を初期のまま止めた条件。制御（動かし方）は普通に学習する。",
 "腕":"手描きスケッチからパイプライン（M1〜M5）が作った、根元を固定した水平 3 関節アーム。",
 "短腕・中腕・長腕":"腕のリンク長だけを 0.5・1.1・1.8 倍した形。全長 0.403・0.887・1.451 m。",
 "根元重・先端重":"全長 0.887 m のまま、リンク長の配分だけ反転した 2 形。根元重 0.500 / 0.250 / 0.137 m、先端重 0.137 / 0.250 / 0.500 m。",
 "第1層":"学習を使わない幾何の診断。届かなければ「N 倍に伸ばせ」と倍率を返す。数秒。",
 "第2層":"学習後の形（ギア比・太さ）が探索範囲の端に張り付いていないかを見る診断。",
 "第3層":"学習した動きを見て、ほとんど使わない関節（使用率 10 % 未満）を「固定してよい」と提案する診断。",
 "参照の制御":"学習を使わず、決めた規則で腕を動かす制御。R では初期姿勢から逆運動学の解へ関節をまっすぐ動かす。",
 "旧い物理":"10-13 より前の、根拠の無い物理の値（密度・トルクの上限など）で回した結果。撤回したので今は使わない。",
 "確定エポック":"そのエポック以降、最後まで一度も最終の順位から外れない最小のエポック。",
 "A1・B1":"手描きスケッチの名前。A1 は標準の腕、B1 は短くずんぐり、B2 は長く細い、A2 は A1 をフリーハンドで描いたもの。",
 "縦型":"台座が立ち、鉛直面内でも曲がる 4 関節の腕。リンクの長さと向きも最適化する。"
};
const T=s=>s.replace(/\{([^}]+)\}/g,(m,k)=>G[k]?`<button type="button" class="term" data-t="${k}">${k}</button>`:k);

/* ---------- カード ---------- */
const SEC=[
 {id:"A",name:"判定器",sub:"形と制御の同時最適化（co-design）は、形の良し悪しの判定に使えるか"},
 {id:"B",name:"速さ",sub:"判定にどれだけ時間がかかるか"},
 {id:"C",name:"助言",sub:"「どう直せばいいか」は当たるか"},
 {id:"D",name:"入力",sub:"手描きからモデルが作れるか（学習を使わない）"},
 {id:"E",name:"言ってはいけない読み",sub:"一度は言ったが、崩れたもの。ぶれなかったのは「どちらが上か」（順位と合否）で、ぶれたのは量・仕組み・細かい分かれ方"},
 {id:"L",name:"限界",sub:"修論 5.3 に書いた、まだ確かめていないこと。聞かれたら先に認める"}];
const F=[
{s:"A",id:"r1",q:"形を最適化すると性能は上がる？",v:"yes",vt:"上がる",tags:["中腕","P","3 s"],fig:"g-r1",
 d:`<p>形の更新を止めた {凍結} と比べた。制御はどちらも学習する。</p><p>50 話を再生して箱を 0.1 m 以上動かした話：最適化 <span class="num">50・50・50</span>、凍結 <span class="num">41・29・38</span>。最適化した形は 3 s とも先端が太さの上限 0.1 m まで太った。</p><p class="from">系譜 9-351（読み 57-1・57-10）／修論 4.4.1</p>`,
 faq:[["制御ではなく、形だけの差と言える？","言えるのは「形を最適化したかどうか」の差まで。制御は両方とも学習するが、最適化した側の制御は新しい形に合わせて学んだもの。制御を固定して形だけ変えた比較ではない。"],
      ["形を最適化しないと押せない？","そうは言わない。{凍結} でも過半の話で箱を動かす。"]],
 old:"rrbot（元のフレームワークにあった 2 関節の腕）の P、1 s ずつ：最適化 132.94 対 凍結 16.75（約 8 倍）。凍結の側は 100 エポックで止まり、設定にも差があった。"},
{s:"A",id:"reach",q:"R でも学習は成り立つ？",v:"yes",vt:"成り立つ",tags:["中腕","R","3 s"],fig:"g-mat",
 d:`<p>届く形は目標で止まる。中腕の {best} は <span class="num">−1.85〜−1.64</span>、助言で 1.99 倍に伸ばした短腕は 50 話すべて最後の誤差 1 mm 未満（図「助言 R」）。</p><p>⚠️ R で形を {凍結} する対照はしていない。形の最適化が R で効くかは未測。</p><p class="from">修論 4.4.3・4.5.4／系譜 9-304</p>`,
 faq:[["なぜ R を確かめた？ 先行研究に無いから？","違う。単純な報酬での同時最適化が、押しだけで起きる現象でないかを見るため。R は箱との接触が無く、報酬の抜け穴が最も少ない（系譜 第2段の「次の仮説」）。"],
      ["−1.85 はどういう値？","1 話 1000 ステップの「先端と目標の距離 [m]」の合計にマイナス。平均 1.85 mm 離れていた。目標へ寄せる間の距離も含むので、届いた後の誤差はもっと小さい。"]],
 old:"rrbot の R（目標 1.5 m は届く範囲の外）、1 s：トポロジー自由 −0.014 対 固定 −0.067。"},
{s:"A",id:"r2",q:"タスクが違えば、最適な形も違う？",v:"no",vt:"分かれない",tags:["A1 縦型 4 関節","R 対 P","5 s"],fig:"g-r2",
 d:`<p>{縦型} の腕で、変えたのはタスクだけ。ギア比 4 つ・先端の太さ・リンク長の合計のどれも、5 s の {帯} が重なる。修論は「R2 は満たされなかった」と書く。</p><p class="from">系譜 9-351（読み 57-5）／修論 4.4.2</p>`,
 faq:[["R はギア 20、P は 400 に分かれたのでは？","それは {旧い物理} の rrbot（ギアの範囲 20〜400）の結果。今は言わない。"],
      ["傾向も無い？","帯は P の方が大きい側に寄るが、重なるので「分かれた」とは言わない。11-17 までは「リンク長の合計だけ分かれる」だったが、11-25 の取り直しで重なった。"],
      ["ギアの範囲を広げれば分かれるのでは？","予想であって観察ではない。押しの中腕で上限を 300 に広げても成績は上がらず、上限から離れた seed もあった。R の seed 0 も 140 と上限の近くにいて、範囲を広げると一緒に上がるかもしれない。結果を見てから読みを変えることにもなるので、言わない。"],
      ["タスクが似ているから形が近くなる？","そうは見えない。形の順位では R と P は逆を選ぶ（図 3）。重なり方を見ると、P は上限の近くにそろい、R が広く散って P の側に入り込んでいる。R は届いた後、ギア比や余分な長さで成績がほとんど変わらず、seed ごとに漂うと読める（仕組みは確かめていない）。"],
      ["R2 が満たされないと何が困る？ 手は打っている？","判定（順位と合否）には響かない。響くのは、収束したギア比を読む {第2層} の助言（「上限に張り付いた → 出力が足りない」）の根拠（修論 4.4.2 の最後）。いま、要るトルクが静力学で分かる「ばねで引き戻される箱」で、第2層が足りないときだけ「足りない」と言うか、助言どおり上限を広げれば達成できるかを確かめている（系譜 9-354・読み 58。11-25 13:39 に投入。段 1 の 6 本は 11-26 夕方、段 2 は 11-27 夜ごろの見込み）。"]],
 old:"rrbot の R 対 P、2 s：ギア比 20（下限）対 400（上限）。縦型 4 関節（9-16）、2 s：先端の太さ 0.030 対 0.100。"},
{s:"A",id:"mat",q:"形の順位はタスクで入れ替わる？",v:"yes",vt:"入れ替わる",tags:["短腕・中腕・長腕","R・P","3 s（短腕 1 s）"],fig:"g-mat",
 d:`<p>R は中腕 ＞ 長腕 ＞ 短腕、P は長腕 ＞ 中腕 ＞ 短腕。「長いほど良い」という 1 本の物差しではない。短腕は R で 397 mm 届かず、P で箱に触れない。</p><p class="from">系譜 9-351（読み 57-2）・9-318／修論 4.4.3.1 表 4.6</p>`,
 faq:[["3 つの腕は何で作った？","{腕} のリンク長だけを 0.5・1.1・1.8 倍した（{短腕・中腕・長腕}）。"],
      ["なぜ R で長腕が負ける？","伸ばした初期姿勢で、長腕の先端は目標の 0.64〜0.68 m 先にある。折りたたんで戻るまでの距離が積み上がる。"],
      ["学習しなくても同じ順位になる？","なる。R は {参照の制御}、P は先端の最大の速さで同じ向き（図「安い方法」）。"]],
 old:"2 s：R 中腕 −3.42 / −1.66 ＞ 長腕 −12.48 / −10.27、P 長腕 96.18〜99.37 ＞ 中腕 34.32〜44.94。"},
{s:"A",id:"dist",q:"全長が同じで配分だけ違う形に、順位を付けられる？",v:"part",vt:"R だけ",tags:["根元重・先端重","R・P","R 3 s・P 5 s"],fig:"g-dist",
 d:`<p>{根元重・先端重} は、{第1層} がどちらにも同じ答え（届く、余裕 10 %）を返す組。R では根元重が上で帯が離れた。P では帯が 0.09 重なった。</p><p class="from">系譜 9-333・9-351（読み 57-3）／修論 4.4.3.2</p>`,
 faq:[["「順位を付けられる」とは？","幾何が同じ答えしか返せない 2 つの形に、学習の判定が seed によらず同じ順位を付けた、という意味。"],
      ["R の差は大きい？","平均の距離で 0.3〜0.7 mm と小さい。{参照の制御} でも同じ向きになるので、修論は対照として扱う。"],
      ["P は前は分けられたのでは？","11-14 までは帯が離れていた。物理の抜け穴（Bug 106・107）を直して取り直すと重なった。"]],
 old:"2 s：R −1.65 / −1.81 ＞ −4.39 / −5.75、P 41.56〜41.77 対 27.89〜40.51（重なる）。"},
{s:"A",id:"cheap",q:"学習なしの安い方法でも、同じ順位が出る？",v:"part",vt:"3 / 4 組で出る",tags:["上の 4 組","R・P"],fig:"g-cheap",
 d:`<p>比べた方法：総リーチ・可操作度・先端の最大の速さ・{参照の制御}・形を {凍結} した学習。R の 2 組は参照の制御で、P の長腕対中腕は先端の最大の速さで同じ順位。P の配分の組はどの方法でも区別できない。</p><p class="from">系譜 9-334〜9-337・9-351／修論 4.4.3.2 表 4.7</p>`,
 faq:[["では学習は要らない？","今の 4 組では、学習しないと付かない順位は無い。ただし P の順位には学習の外の正解が無い（P の参照の制御は押せない形があり比べられない）。修論 5.3 の 4 の限界。<br><br><b>学習を使う理由</b>: 安い方法は、与えられた形に順位を付けるだけで、形を良い方へ動かさない。形を調整した結果を返すのは学習だけで、P では最適化すると{凍結}より上がる（R1、中腕 8.38〜8.63 対 5.79〜6.03、3 s）。<br>⚠️ ただし言えるのは「最適化すると P が上がる」まで。① 「タスクに合わせて直す」は言えない（R2 が満たされない）。② 調整した形が最良かの正解も外に無い（5.3 の 4 は調整の側にも掛かる）。③ 何を動かして上がったかは読めていない（{第2層}の弱さ。ばねの箱で確かめ中）。順位の限界を消す理由ではなく、別の柱。"]],
 old:null},
{s:"B",id:"r4",q:"何エポックで順位が決まる？",v:"part",vt:"形が違えばほぼ 30",tags:["5 組","R・P","2 s（較正）"],fig:null,
 d:`<p>形の違う対は 15 中 14 が 30 エポック（約 1.3 時間）までに決まった（{確定エポック} は <span class="num">1〜127</span>）。乱数だけ違う対は <span class="num">22〜194</span> とばらつく。</p><p class="from">系譜 9-351（読み 57-8）／修論 4.4.4</p>`,
 faq:[["30 エポックで足りる？","較正に使った対ではほぼ足りる。ただし較正に使っていない 7 組のうち 2 組は、30 エポック目の順位が最後と逆だった。システムは帯が重なれば「区別できない」と出す。"],["学習なしで順位が出るなら、もう要らない？","残す。ただし言い方は「学習で判定するなら、どこで打ち切れるかの目安」。安い方法は数秒、学習は 30 エポックで約 1.3 時間なので、「判定が速い」とは言わない。学習を使う理由は順位ではなく、形を最適化した結果を出すのが学習だけであること（{凍結}との比較、R1）。修論 4.4.4・5.2.2。"],
      ["最初のころの順位は当てになる？","ならない。R の中腕対長腕（seed 1）は、0〜20 エポックの間は逆の順位だった。"]],
 old:null},
{s:"B",id:"time",q:"一巡にどれだけかかる？",v:"info",vt:"大半は学習",tags:["—"],fig:null,
 d:`<p>モデル生成（M3〜M5）約 2 秒、{第1層} 数秒、三層の診断 約 3 秒、判定の学習 約 1.3 時間（30 エポック）。幾何で不適合な形は学習なしで数秒で棄却できる。</p><p class="from">修論 4.6 表 4.13</p>`,

{s:"C",id:"diag",q:"診断（三層）は学習後の順位と合う？",v:"yes",vt:"合う",tags:["短腕・中腕・長腕","R・P","既存の学習"],fig:null,
 d:`<p>「この形ではできない」とした 2 条件（R と P の短腕）は、どちらも最下位だった。中腕と長腕の上下は幾何では決まらないので、診断は順位を言わない。</p><p>⚠️ {第2層} だけで見ると、短腕のギア比は端に揃わず「範囲の内側」と出て、不適合を見逃す。</p><p class="from">系譜 9-292／修論 4.5.1</p>`,

{s:"C",id:"clr",q:"「N 倍に伸ばせ」に従うと届く？",v:"yes",vt:"届く",tags:["短腕・B1","R","2 s"],fig:"g-clr",

 faq:[["伸ばせば届くのは当たり前では？","その通り。示したのは「倍率の値が正しい」ことで、学習の難しさの比較ではない。"],
      ["ただのバグ探しでは？","入れ直して初めて、倍率の丸め（1.9846 を 1.98 と表示して 2 mm 足りない）が見つかった。判定が正しくても助言が使えない欠陥は、助言どおり直した形を入れ直さないと見えない（想定問答 Q83）。"]],

{s:"C",id:"clp",q:"P でも助言で直る？",v:"yes",vt:"押し込む距離を足せば",tags:["短腕","P","2 s"],fig:"g-clp",

{s:"C",id:"l2",q:"「ギア比の上限を広げよ」に従うと上がる？",v:"no",vt:"上がらない",tags:["中腕","P","3 s 対 2 s"],fig:"g-l2",

{s:"C",id:"l3",q:"「この関節は固定してよい」に従うと落ちない？",v:"part",vt:"落ちない／見落としあり",tags:["中腕・A1","R・P","3 s"],fig:"g-l3",

{s:"C",id:"obs",q:"柱（障害物）を判定に入れられる？",v:"part",vt:"入れた／学習は届かない",tags:["A1 縦型","R","2 s"],fig:"g-obs",

 faq:[["なぜ同時最適化で届かなくなる？","学習が形を設計の下限まで縮め、届く範囲の外へ出た（系譜 9-313）。なぜ縮めるかの仕組みは確かめていない。修論 5.3 の 4 の限界。"]],

{s:"D",id:"axes",q:"関節の軸を関節ごとに選べる？",v:"part",vt:"選べる／推定はしない",tags:["A1 縦型"],fig:null,

{s:"D",id:"prune",q:"軸の候補を第1層で前もって減らせる？",v:"no",vt:"長さも最適化するなら無理",tags:["A1 縦型・81 通り","R・P","2 s"],fig:null,
 d:`<p>長さを凍結すれば R 45 %・P 41 % を削れる。学習の設定（長さを ±0.5 m 最適化）では R 4 %・P 0 %。棄却した配置を学習させたら 2.1 / 4.0 mm まで届いた（この学習は {旧い物理}）。</p><p class="from">系譜 9-127・9-151・9-152</p>`,faq:[],old:null},
{s:"E",id:"e-old",q:"10-13 より前の学習の結果を、今の結論として言ってよい？",v:"no",vt:"言わない",tags:["旧い物理"],fig:null,d:"<p>物理の値に根拠が無く（密度・回転子の慣性・トルクの上限 400）、制御入力の上限なし・非決定的な物理などの欠陥が重なっていた。全部を実在の値で取り直した。</p><p class=\"from\">系譜 9-241〜9-247</p>",faq:[["代わりに何と言う？","今の物理（実在の値）で取り直した結果だけを言う。撤回したことは修論で開示している。"]],old:null},
{s:"E",id:"e-r2",q:"「タスクが違えば最適な形も分かれる」と言ってよい？",v:"no",vt:"言わない",tags:["R2"],fig:"g-r2",d:"<p>ギア比 → リンク長の合計と 3 回狭めた末、11-25 の取り直し（5 s）でリンク長の合計も重なった。</p><p class=\"from\">系譜 9-351（読み 57-5）</p>",faq:[["代わりに何と言う？","タスクだけを変えたとき、5 seed の範囲で分かれる設計変数は無かった（R2 は満たされなかった）。"]],old:null},
{s:"E",id:"e-dist",q:"「押しの配分は、形も最適化する判定だけが区別した」と言ってよい？",v:"no",vt:"言わない",tags:["P・配分"],fig:"g-dist",d:"<p>物理の抜け穴（Bug 106・107）を直して取り直すと、5 s の帯が 0.09 重なった。形を凍結した判定も重なる。</p><p class=\"from\">系譜 9-351（読み 57-3）</p>",faq:[["代わりに何と言う？","到達では区別でき、押しはどの方法でも区別できなかった。"]],old:null},
{s:"E",id:"e-l2",q:"「第2層の助言（ギア比の上限を広げる）に従えば上がる」と言ってよい？",v:"no",vt:"言わない",tags:["第2層"],fig:"g-l2",d:"<p>Bug 106（速度の上限を tick の後で切る）が、上限を広げるほど大きく効いていた。直すと 150 と 300 の帯が重なる。</p><p class=\"from\">系譜 9-351（読み 57-4）</p>",faq:[["代わりに何と言う？","学習から出る助言に従った 1 例で、向上は確認できなかった。"]],old:null},
{s:"E",id:"e-sg",q:"「Stackelberg の項のおかげで形を正しく評価できる」と言ってよい？",v:"no",vt:"言わない",tags:["手法"],fig:null,d:"<p>その項を外した比較をしていない。測ると、その項の 8 割以上は標本の雑音だった。形をリターンで評価する性質は、ふつうの同時最適化（BodyGen）も持つ。</p><p class=\"from\">系譜 9-352・想定問答 Q76</p>",faq:[["代わりに何と言う？","原論文の公開実装の勾配で形を更新している。その項の効果は比べていない。"]],old:null},
{s:"E",id:"e-engine",q:"「判定器は形の優劣を正しく判定できる」と言ってよい？",v:"no",vt:"言わない",tags:["判定器"],fig:"g-cheap",d:"<p>正解が学習の外にある組（短腕、到達の 2 組、押しの長腕対中腕）は、学習なしでも同じ答えが出る。外に正解が無い押しの配分は区別できなかった。</p><p class=\"from\">系譜 9-353・9-351</p>",faq:[["代わりに何と言う？","正解が学習の外にある組では、外の正解と同じ順位を出した。"]],old:null},
{s:"E",id:"e-obs",q:"「柱を避けて届く姿勢はあるのに、学習が届かない」と言ってよい？",v:"no",vt:"言わない",tags:["障害物"],fig:"g-obs",d:"<p>判定器が根元のヨー関節をピッチとして数え、届く許容が 644 mm あった（Bug 83）。正しく数えると、初期の形でも学習した形でも届かない。</p><p class=\"from\">系譜 9-312</p>",faq:[["代わりに何と言う？","届く長い腕から同時最適化すると形が縮んで届かず、同じ形を固定すると届く。"]],old:null},
{s:"E",id:"e-sig",q:"「ギア比と太さが下限に張り付いた＝不適合」と言ってよい？",v:"no",vt:"言わない",tags:["形の読み方"],fig:null,d:"<p>届いた中腕の seed 0 も、ギア比が 3 関節とも下限だった。不適合な短腕は張り付かない。</p><p class=\"from\">系譜 9-282・修論 4.4.3.1</p>",faq:[["代わりに何と言う？","収束した形だけでは良し悪しは言えない。幾何（届くか）か、実際に届いたかと組み合わせて読む。"]],old:null},
{s:"E",id:"e-inertia",q:"「順位の差は慣性（腕の重さ）で説明できる」と言ってよい？",v:"no",vt:"言わない",tags:["仕組み"],fig:null,d:"<p>慣性に帰属させた説明は 3 回とも外れた（余裕・長さ・配分）。到達の差のほとんどは、初期姿勢から目標までの距離（幾何）だった。</p><p class=\"from\">系譜 9-47・9-49・9-89・9-296</p>",faq:[["代わりに何と言う？","仕組みは特定していない。到達の差は、初期姿勢から目標へ寄せる距離でほぼ決まる。"],["根元重 対 先端重の R は？","寄せの遅れは、向かった姿勢まで関節を何度回すかで説明できる（3 s とも、形で 6 % 以内）。差の過半は保持で、揺れではなく止まった姿勢のずれ（関節に直しても 2.5〜5.9 倍）。腕は水平に動くので保つのに重力の力は要らず、制御コストの差は 1 割未満。止まった位置が惰性（慣性）で決まる余地は残るので、「慣性のせい」とも「関係ない」とも言わない。系譜 9-356、修論 4.4.3.2。"]],old:null},
{s:"E",id:"e-margin",q:"「倍率に余裕（10 %）を足した方が安全」と言ってよい？",v:"no",vt:"言わない",tags:["第1層"],fig:null,d:"<p>余裕を 0 / 5.3 / 10 % と振ると、余裕が大きいほど到達が悪くなった（旧い物理の梯子）。</p><p class=\"from\">系譜 9-11・9-30</p>",faq:[["代わりに何と言う？","助言は判定を覆す最小の倍率（例: 1.99 倍）だけを返す。必要な余裕はタスクで違う。"]],old:null},
{s:"E",id:"e-first",q:"「タスクで順位が入れ替わることを初めて示した」と言ってよい？",v:"no",vt:"言わない",tags:["新規性"],fig:null,d:"<p>入れ替わりそのものは Ha et al.（2016）が示している。</p><p class=\"from\">想定問答 Q28</p>",faq:[["代わりに何と言う？","判定器が「長いほど良い」という 1 本の物差しになっていない証拠、まで。"]],old:null},
{s:"E",id:"e-user",q:"「機械の知識が無い人でも使えた」と言ってよい？",v:"no",vt:"言わない",tags:["利用者"],fig:null,d:"<p>利用者を対象にした評価をしていない。</p><p class=\"from\">修論 5.3 の 5・想定問答 Q9</p>",faq:[["代わりに何と言う？","入力は形だけで、出力はリンク長の倍率のように専門知識の要らない形式である、まで。"]],old:null},
{s:"E",id:"e-real",q:"「実機（軸6）で確かめた」と言ってよい？",v:"no",vt:"言わない",tags:["実機"],fig:null,d:"<p>軸6 は部品の寸法とサーボの諸元に合わせたシミュレーションで、組んだ腕は動かしていない。</p><p class=\"from\">想定問答 Q46</p>",faq:[["代わりに何と言う？","部品で組める設計空間でも、シミュレーション上で同じ流れが通った。"]],old:null},
{s:"E",id:"e-robust",q:"「3 seed で一致したので再現性がある・頑健」と言ってよい？",v:"no",vt:"言わない",tags:["seed"],fig:null,d:"<p>数 seed では言えない。検定もしていない。同じ分布でも 3 対 3 の帯が偶然離れる確率は 1/10 ある。</p><p class=\"from\">想定問答 Q7・系譜 9-351 の注記</p>",faq:[["代わりに何と言う？","seed の間で一貫した。帯が重なったものは「区別できない」と書いた。"]],old:null},

function card(f){
  const acts=[];
  if(f.fig) acts.push(`<a class="fig" href="#${f.fig}" data-jump="${f.fig}" data-from="${f.id}">図 ${figNo[f.fig]} ↓</a>`);

  if(f.old) acts.push(`<button type="button" class="old" data-p="o">旧い物理では</button>`);
  const panels=[`<div class="panel" data-k="d" hidden>${T(f.d)}</div>`]
   .concat(f.faq.map((x,i)=>`<div class="panel" data-k="q${i}" hidden><p>${T(x[1])}</p></div>`))
   .concat(f.old?[`<div class="panel" data-k="o" hidden><p>${T(f.old)}</p><p class="from">撤回した結果。今は使わない</p></div>`]:[]);
  return `<article class="card" id="${f.id}"><div class="row1"><h3 class="q">${f.q}</h3><span class="pill ${f.v}">${f.vt}</span></div>
  <div class="tags">${f.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>

}

const NS="http://www.w3.org/2000/svg";
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function ticks(min,max,log){
  if(log){const t=[];for(let v=Math.pow(10,Math.ceil(Math.log10(min)));v<=max;v*=10)t.push(v);return t}
  const span=max-min,raw=span/5,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=6);
  const t=[];for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)t.push(+v.toFixed(6));return t;
}
const fmt=v=>{const a=Math.abs(v);let s=a>=100?a.toFixed(0):a>=10?(+a.toFixed(1)).toString():(+a.toFixed(2)).toString();return (v<0?"−":"")+s};
function panel(svg,p,y0,W){
  const L=118,R=W-18,rowH=30,top=p.title?22:6;
  const sx=v=>p.log?L+(Math.log10(v)-Math.log10(p.min))/(Math.log10(p.max)-Math.log10(p.min))*(R-L):L+(v-p.min)/(p.max-p.min)*(R-L);
  if(p.title) el("text",{x:0,y:y0+14,class:"ptitle"},svg).textContent=p.title;
  const h=top+p.rows.length*rowH+24, yAx=y0+top+p.rows.length*rowH+2;
  ticks(p.min,p.max,p.log).forEach(t=>{const x=sx(t);el("line",{x1:x,x2:x,y1:y0+top,y2:yAx,class:"ax"},svg);
    el("text",{x:x,y:yAx+14,"text-anchor":"middle",class:"tk"},svg).textContent=p.log?(t>=1?t:t.toString()):fmt(t)});
  if(p.ref){const x=sx(p.ref.v);el("line",{x1:x,x2:x,y1:y0+top-4,y2:yAx,class:"ref"},svg);el("text",{x:x+4,y:y0+top+6,class:"tk"},svg).textContent=p.ref.label}
  p.rows.forEach(([lab,vals,col],i)=>{
    const cy=y0+top+i*rowH+rowH/2;
    el("text",{x:0,y:cy+4,class:"lab"},svg).textContent=lab;
    const inR=vals.filter(v=>v>=p.min&&v<=p.max);
    if(inR.length>1){const a=sx(Math.min(...inR)),b=sx(Math.max(...inR));
      el("rect",{x:a-6,y:cy-7,width:Math.max(12,b-a+12),height:14,rx:7,style:`fill:${col};fill-opacity:.18;stroke:${col};stroke-opacity:.45`},svg)}
    vals.forEach((v,j)=>{
      const off=v<p.min, over=v>p.max, x=off?L:over?R:sx(v);
      let mark;
      if(off||over){mark=el("path",{d:off?`M${x+8} ${cy-6} L${x} ${cy} L${x+8} ${cy+6} Z`:`M${x-8} ${cy-6} L${x} ${cy} L${x-8} ${cy+6} Z`,style:`fill:${col}`},svg);
        el("text",{x:off?x+12:x-12,y:cy+4,"text-anchor":off?"start":"end",class:"tk"},svg).textContent=fmt(v)+"（目盛りの外）"}
      else mark=el("circle",{cx:x,cy:cy,r:5,style:`fill:${col};stroke:var(--surface);stroke-width:2`},svg);
      const hit=el("circle",{cx:x,cy:cy,r:12,class:"hit",tabindex:0,"aria-label":`${lab} seed ${j}: ${fmt(v)}`},svg);
      hit.dataset.tip=`<b>${lab}</b>${vals.length>1?`seed ${j}：`:""}<span class="num">${fmt(v)}</span>`;
    });
  });
  return h;
}
function drawChart(box,f){
  const W=640;const svg=el("svg",{viewBox:`0 0 ${W} 100`,role:"img","aria-label":f.t});
  let y=0;f.panels.forEach((p,i)=>{y+=panel(svg,p,y,W)+(i<f.panels.length-1?10:0)});
  svg.setAttribute("viewBox",`0 0 ${W} ${y}`);box.appendChild(svg);
}
function drawGrid(box){

  box.innerHTML=`<table class="grid"><thead><tr><th>組</th>${GRID.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${GRID.rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(m).join("")}</tr>`).join("")}</tbody></table>`;
}

let backTo={};
function flash(t){t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash");setTimeout(()=>t.classList.remove("flash"),1400)}
function jump(id){const t=document.getElementById(id);if(!t)return;
  const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;t.scrollIntoView({behavior:rm?"auto":"smooth",block:"start"});flash(t)}
const tip=$("#tip");let tipFor=null;
function showTip(html,anchor){tip.innerHTML=html;tip.hidden=false;const r=anchor.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),y=r.top-h-8;if(y<8)y=r.bottom+8;tip.style.left=x+"px";tip.style.top=y+"px";tipFor=anchor}
function hideTip(){tip.hidden=true;tipFor=null}
document.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]");
  if(j){e.preventDefault();const id=j.dataset.jump;if(j.dataset.from){const fig=document.getElementById(id);fig.querySelector(".back").dataset.jump=j.dataset.from;fig.querySelector(".back").setAttribute("href","#"+j.dataset.from)}jump(id);hideTip();return}
  const term=e.target.closest(".term");
  if(term){if(tipFor===term){hideTip();return}showTip(`<b>${term.dataset.t}</b>${G[term.dataset.t]}`,term);return}
  const hit=e.target.closest(".hit");
  if(hit){showTip(hit.dataset.tip,hit);return}
  const b=e.target.closest(".acts button");
  if(b){const c=b.closest(".card"),k=b.dataset.p,open=b.getAttribute("aria-expanded")==="true";
    c.querySelectorAll(".acts button").forEach(x=>x.setAttribute("aria-expanded","false"));c.querySelectorAll(".panel").forEach(p=>p.hidden=true);
    if(!open){b.setAttribute("aria-expanded","true");c.querySelector(`.panel[data-k="${k}"]`).hidden=false}hideTip();return}
  if(!e.target.closest("#tip"))hideTip();
});
document.querySelectorAll(".acts button").forEach(b=>b.setAttribute("aria-expanded","false"));
document.addEventListener("mouseover",e=>{const h=e.target.closest(".hit");if(h)showTip(h.dataset.tip,h)});
document.addEventListener("mouseout",e=>{const h=e.target.closest(".hit");if(h&&tipFor===h)hideTip()});
document.addEventListener("focusin",e=>{const h=e.target.closest(".hit");if(h)showTip(h.dataset.tip,h)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTip()});
addEventListener("scroll",()=>{if(!tip.hidden)hideTip()},{passive:true});
