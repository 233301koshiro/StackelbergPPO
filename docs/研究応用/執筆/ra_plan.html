<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff}
  svg{display:block;font-family:"IPAPGothic","IPAGothic",sans-serif}
  .h{font-size:30px;font-weight:bold;fill:#1f2937}
  .s{font-size:23px;fill:#374151}
  .n{font-size:21px;fill:#6b7280}
  .badge{font-size:22px;font-weight:bold;fill:#fff}
</style></head><body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea8a2e"/>
    </marker>
    <!-- 部品で組んだリンク: ヒンジ(灰)・ブロック(黄)・フレーム(灰) -->
    <g id="blk"><rect x="0" y="-13" width="20" height="26" rx="3" fill="#f2c94c" stroke="#b8932a" stroke-width="2"/></g>
    <!-- 部品で組む腕（台・サーボ・上腕・前腕・箱）。② と ③ で同じものを使う。下端は y=500 -->
    <g id="arm">
      <rect x="640" y="484" width="110" height="16" rx="3" fill="#9ca3af"/>
      <rect x="670" y="424" width="50" height="60" rx="6" fill="#262626"/>
      <!-- 上腕: 根元 (695,430) から -55° -->
      <g transform="translate(695,430) rotate(-55)">
        <rect x="0" y="-15" width="22" height="30" rx="3" fill="#b0b7c3" stroke="#6b7280" stroke-width="2"/>
        <use href="#blk" x="24"/><use href="#blk" x="46"/><use href="#blk" x="68"/><use href="#blk" x="90"/>
        <rect x="112" y="-15" width="22" height="30" rx="3" fill="#b0b7c3" stroke="#6b7280" stroke-width="2"/>
        <rect x="134" y="-25" width="50" height="50" rx="6" fill="#262626"/>
      </g>
      <!-- 前腕: (695+159cos55, 430-159sin55) ≈ (786,300) から +30° -->
      <g transform="translate(786,300) rotate(30)">
        <rect x="0" y="-15" width="22" height="30" rx="3" fill="#b0b7c3" stroke="#6b7280" stroke-width="2"/>
        <use href="#blk" x="24"/><use href="#blk" x="46"/><use href="#blk" x="68"/>
        <rect x="90" y="-15" width="22" height="30" rx="3" fill="#b0b7c3" stroke="#6b7280" stroke-width="2"/>
        <rect x="112" y="-25" width="50" height="50" rx="6" fill="#262626"/>
        <rect x="162" y="-11" width="48" height="22" rx="4" fill="#b0b7c3" stroke="#6b7280" stroke-width="2"/>
      </g>
      <rect x="955" y="452" width="46" height="46" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/>
    </g>
  </defs>

  <!-- ===== パネル ===== -->
  <rect x="30" y="40" width="470" height="625" rx="18" fill="#eef4fb" stroke="#9dbbe0" stroke-width="2"/>
  <rect x="565" y="40" width="470" height="625" rx="18" fill="#fdf6ec" stroke="#e7c08d" stroke-width="2"/>
  <rect x="1100" y="40" width="470" height="625" rx="18" fill="#fdf6ec" stroke="#e7c08d" stroke-width="2"/>

  <!-- バッジ -->
  <rect x="55" y="62" width="120" height="40" rx="20" fill="#3b78c2"/><text x="115" y="90" text-anchor="middle" class="badge">① いま</text>
  <rect x="590" y="62" width="120" height="40" rx="20" fill="#ea8a2e"/><text x="650" y="90" text-anchor="middle" class="badge">② 予定</text>
  <rect x="1125" y="62" width="120" height="40" rx="20" fill="#ea8a2e"/><text x="1185" y="90" text-anchor="middle" class="badge">③ 予定</text>

  <!-- 見出し -->
  <text x="55" y="148" class="h">シミュレーションで</text>
  <text x="55" y="186" class="h">形と動かし方を学習</text>
  <text x="590" y="148" class="h">研究室の部品で</text>
  <text x="590" y="186" class="h">組める形だけを探す</text>
  <text x="1125" y="148" class="h">組み立てて</text>
  <text x="1125" y="186" class="h">実物で動かす</text>

  <!-- ===== ① 連続の腕 ===== -->
  <line x1="60" y1="500" x2="470" y2="500" stroke="#9ca3af" stroke-width="3"/>
  <rect x="120" y="470" width="60" height="30" rx="4" fill="#94a3b8"/>
  <line x1="150" y1="470" x2="250" y2="330" stroke="#6b9bd1" stroke-width="30" stroke-linecap="round"/>
  <line x1="250" y1="330" x2="380" y2="400" stroke="#6b9bd1" stroke-width="24" stroke-linecap="round"/>
  <line x1="380" y1="400" x2="405" y2="455" stroke="#6b9bd1" stroke-width="20" stroke-linecap="round"/>
  <circle cx="150" cy="470" r="9" fill="#1e3a5f"/><circle cx="250" cy="330" r="9" fill="#1e3a5f"/><circle cx="380" cy="400" r="9" fill="#1e3a5f"/>
  <rect x="418" y="452" width="46" height="46" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/>
  <!-- 長さは連続 -->
  <line x1="272" y1="300" x2="392" y2="365" stroke="#3b78c2" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="300" y="296" class="n" fill="#3b78c2">長さは自由</text>
  <text x="55" y="548" class="s">腕の重さはアルミパイプ、</text>
  <text x="55" y="581" class="s">モータの力と速さは UR5e から</text>
  <text x="55" y="614" class="s">→ 長さも力も自由に決まるので、</text>
  <text x="55" y="647" class="s">　組める部品が実在するとは限らない</text>

  <!-- ===== ② 部品で組む腕 ===== -->
  <line x1="595" y1="500" x2="1005" y2="500" stroke="#9ca3af" stroke-width="3"/>
  <use href="#arm"/>
  <!-- とびとびの長さ（目盛り） -->
  <line x1="820" y1="250" x2="1000" y2="250" stroke="#ea8a2e" stroke-width="3"/>
  <g stroke="#ea8a2e" stroke-width="3">
    <line x1="820" y1="240" x2="820" y2="260"/><line x1="842" y1="240" x2="842" y2="260"/><line x1="864" y1="240" x2="864" y2="260"/>
    <line x1="886" y1="240" x2="886" y2="260"/><line x1="908" y1="240" x2="908" y2="260"/><line x1="930" y1="240" x2="930" y2="260"/>
    <line x1="952" y1="240" x2="952" y2="260"/><line x1="974" y1="240" x2="974" y2="260"/><line x1="996" y1="240" x2="996" y2="260"/>
  </g>
  <text x="820" y="232" class="n" fill="#c06a12">長さはとびとび</text>
  <text x="590" y="548" class="s">サーボと部品の値で学習し、</text>
  <text x="590" y="581" class="s">そのまま組める形を出す</text>
  <!-- 凡例 -->
  <rect x="592" y="226" width="18" height="18" rx="3" fill="#262626"/><text x="617" y="242" class="n">サーボ</text>
  <rect x="692" y="226" width="18" height="18" rx="3" fill="#f2c94c" stroke="#b8932a"/><text x="717" y="242" class="n">部品</text>

  <!-- ===== ③ 実物 ===== -->
  <rect x="1130" y="440" width="410" height="16" rx="3" fill="#d6b88c"/>
  <!-- ② と同じ腕を 0.8 倍で台の上（y=440）に置く -->
  <use href="#arm" transform="translate(623,40) scale(0.8)"/>
  <!-- シミュレーションと実物のずれ -->
  <rect x="1415" y="235" width="140" height="120" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <path d="M1425,335 C1455,330 1470,265 1500,262 S1540,300 1548,298" fill="none" stroke="#3b78c2" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M1425,338 C1460,336 1478,285 1508,280 S1542,308 1548,310" fill="none" stroke="#ea8a2e" stroke-width="3"/>
  <text x="1485" y="228" text-anchor="middle" class="n">関節の角度</text>
  <line x1="1150" y1="490" x2="1180" y2="490" stroke="#3b78c2" stroke-width="3" stroke-dasharray="7 5"/><text x="1188" y="497" class="n">シミュレーション</text>
  <line x1="1370" y1="490" x2="1400" y2="490" stroke="#ea8a2e" stroke-width="3"/><text x="1408" y="497" class="n">実物</text>
  <text x="1125" y="548" class="s">シミュレーションどおりに</text>
  <text x="1125" y="581" class="s">動くか、ずれを測る</text>

  <!-- ===== 矢印 ===== -->
  <line x1="505" y1="340" x2="558" y2="340" stroke="#9ca3af" stroke-width="6" marker-end="url(#ah)"/>
  <line x1="1040" y1="340" x2="1093" y2="340" stroke="#9ca3af" stroke-width="6" marker-end="url(#ah)"/>
  <!-- 戻りのループ -->
  <path d="M1335,670 L1335,770 L800,770 L800,675" fill="none" stroke="#ea8a2e" stroke-width="6" marker-end="url(#ahO)"/>
  <text x="1067" y="822" text-anchor="middle" class="s" style="font-weight:bold;fill:#c06a12">ずれをシミュレーションへ戻す ＝ sim to real のギャップを埋める</text>
  <text x="1067" y="862" text-anchor="middle" class="n">部品とサーボ: 研究室のロボット組み立てシステム Robot Assembler</text>
</svg>
</body></html>
