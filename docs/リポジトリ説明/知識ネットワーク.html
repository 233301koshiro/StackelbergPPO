 2026-10-16: 実在の物理では帯が離れた（prox [11.39, 12.09]・dist [−0.00, 7.04]、読み ⑤、系譜 9-259…",""],["知見 A8","finding","識別は非平面でも成立するか",6,"docs/研究応用/執筆/知見総括表.md:23","知見: 成立。先端の質量分布で分岐 実験: v3 で Reach/Pusher を同一予算 数値: 太さ Reach 0.0300/0.0305 対 Pusher 0.1000/0.0999 系譜の段: 9-16",""],["知見 A9","finding","「関節を固定してよい」に従うと本当に落ちないか",6,"docs/研究応用/執筆/知見総括表.md:24","知見: ⭐ 閉ループ成立。しかもタスクごとに正しい。助言が出た Reach は良化、出ていない Pusher は悪化。第1層（増やす助言）と合わせ増減の両方向で閉じた 実験: 関節3 を固定して両タスクを学習（e2e_a1_fix3） 数値: Reach −6.30 → −5.32（+15.6 %） / Pusher 203.40 → 179.89（−11.6 %）。2 条件化済み（9-61 / 9-62）だが強さが違う（⚠️ 「2 seed」ではなく「2 形態 × 1 seed」。9-105）: 到達は帯が重ならず但し書きが外れた（[−6.30, −5.83] / [−5.32, −3.85]）、押しは帯が重なるので向きのみ（[203.40, 258.98] / [179.89, 249.66]）。⚠️ 一括…",""],["知見 A10","finding","手描き 3 枚を縦型で学習したらどうなるか",6,"docs/研究応用/執筆/知見総括表.md:25","知見: ⚠️ 順位は両タスクとも主張できない。 1 seed では Reach 単調悪化・Pusher は A1v 突出と読めたが、2 seed 目でどちらも崩れた（9-31・9-34）。言えるのは ①縦型でも学習が通り両タスクとも目標に到達する ②縦型は seed 依存が大きく、最も短い A1v だけが安定 実験: A1v/A2v/B2v（余裕 20/32/35 %）× 2 タスク × 2 seed 数値: Reach 幅 A1v 0.64 / A2v 3.69 / B2v 9.07。Pusher 幅 A1v 1.02 倍 / 他 2.6〜2.9 倍。「余裕は単調に害」の根拠は 9-11 の梯子のみ（同一形態を余裕だけ振った統制実験） 系譜の段: 9-29 → 9-34",""],["知見 A11","finding","自由度の数もタスク識別の軸か",6,"docs/研究応用/執筆/知見総括表.md:26","知見: ⚠️ 判定不能。交絡が外せない（縦型はリンク長も最適化され腕が約 2 倍に伸びる）。言えるのはパイプラインが非平面を生成し学習まで通せることまで 実験: 縦型 4 関節（2 seed）対 平面 3 関節 数値: Reach −6.30 対 −13.65/−14.29、Pusher 203.40 対 348.56/340.39（リンク長 1.010 m 対 1.96〜2.66 m） 系譜の段: 9-24",""],["知見 A12","finding","失敗は形態のせいか、制御・報酬のせいか切り分けられるか",6,"docs/研究応用/執筆/知見総括表.md:28","知見: ❌「できない」は学習不要の幾何（第1層）／比較は共通報酬なので報酬の欠陥は打ち消える／⭕「できる」は主張しない。層分けがそのまま切り分けの機構（9-10）。⚠️ 打ち消しが効くのは既存タスク内の比較のみ。新タスクは報酬側を先に潰す（9-41） 実験: 方法論の明文化（既存結果の意味づけ） 数値: — （研究方針「失敗の帰属」・想定問答） 系譜の段: 9-56",""],["知見 B","theme","B. 判定の速さ（実用性）",1,"docs/研究応用/執筆/知見総括表.md:30","",""],["知見 B1","finding","どの成分の転用が効くか",19,"docs/研究応用/執筆/知見総括表.md:34","知見: 形態ネットを含む転用が効く。制御のみは転用元を超えない 実験: K1/K2/I1 vs 転用元 H1 数値: K1 93.82 / K2 193.69 / I1 210.58（H1 140.47） 系譜の段: 4",""],["知見 B2","finding","転用は収束を速めるか",19,"docs/研究応用/執筆/知見総括表.md:35","知見: 半分だけ支持（速いが最終値は別） 実験: 収束速度の比較 数値: — 系譜の段: 9-3",""],["知見 B3","finding","長さと gear のどちらが効くか",19,"docs/研究応用/執筆/知見総括表.md:36","知見: 長さ gear。ただし寄与率は確定できない（分母が作れない） 実験: M 系 ablation 1000ep 数値: M1 41.41/62.06 系譜の段: 9-5",""],["知見 C","theme","C. 診断フィードバック（助言は使えるか）",1,"docs/研究応用/執筆/知見総括表.md:38","",""],["知見 C1","finding","診断の判定は正しいか",23,"docs/研究応用/執筆/知見総括表.md:42","知見: 総合判定は 6/6 一致。ただし第2層は両方向に誤る 実験: マトリクス6条件で事後検証 数値: 6/6 系譜の段: 9-10",""],["知見 C2","finding","助言に従えば解決するか",23,"docs/研究応用/執筆/知見総括表.md:43","知見: ✅ 解決する。これが軸3の主結果 実験: 閉ループ（助言→形態生成→再入力） 数値: 残距離 397 mm → 0.33 mm（−396.92 → −0.33/−0.27、2 seed） 系譜の段: 9-11",""],["知見 C3","finding","余裕を足すべきか",23,"docs/研究応用/執筆/知見総括表.md:44","知見: ❌ 余裕は単調に害。当初設計を反証 実験: 余裕 0 / 5.3 / 10 % の梯子 数値: −0.27〜−0.33 / −1.19〜−1.41 / −1.66〜−3.42（隣接条件も域が重ならない） 系譜の段: 9-11",""],["知見 C4","finding","害の原因は制御コストか",23,"docs/研究応用/執筆/知見総括表.md:45","知見: ❌ 違う。ctrl=0 でも差は残る 実験: ctrl_cost 0.2 → 0 の1変数対照 数値: ctrl=0 でも 0% −0.30〜−0.48 対 10% −1.46〜−2.01 系譜の段: 9-15",""],["知見 C5","finding","「設計を減らす」助言は出せるか",23,"docs/研究応用/執筆/知見総括表.md:46","知見: 実装済み。検証は 9-27 で決着 実験: 第3層に関節使用率を追加 数値: 使用率 Reach 7 % / Pusher 41 %（旧い物理。⛔ 今の物理では A1 の到達でも 47 % / 31 % で提案は出ない、系譜 9-292。修論 4.5.5 は「閾値が挙げなかった関節の固定」に書き直した） 系譜の段: 9-20",""],["知見 C6","finding","判定器は障害物を扱えるか",23,"docs/研究応用/執筆/知見総括表.md:47","知見: ⭐ 扱えるようになった。⚠️ 目撃型（柱を避けて届く姿勢を 1 つ見つけたときだけ断定する）にして棄却側だけが確実という保証（9-78）を壊さない 実験: 柱を第1層へ組み込み 数値: 実物の柱で到達姿勢 87152 個のうち 21244 個が干渉しない。柱を半幅 0.30 にすると 0 個 系譜の段: ⭐⭐ 9-144",""],["知見 D","theme","D. パイプライン（入力側）",1,"docs/研究応用/執筆/知見総括表.md:51","",""],["知見 D1","finding","手描きが XML まで通るか",30,"docs/研究応用/執筆/知見総括表.md:55","知見: 通る。描いた比が保存される 実験: A1 の実走 数値: 総リーチ 1.0102 m・余裕 21 % 系譜の段: 9-18",""],["知見 D2","finding","描き分けが判定に残るか",30,"docs/研究応用/執筆/知見総括表.md:56","知見: 残る。判定を跨いだ 実験: A1 と B1 の比較 数値: A1 1.0102 m ✅ 対 B1 0.7891 m ❌（1.02 倍に伸ばせ。⚠️ 9-30 の上乗せ撤去前は 1.12 倍） 系譜の段: 9-19",""],["知見 D3","finding","非平面をパイプラインが出せるか",30,"docs/研究応用/執筆/知見総括表.md:57","知見: 出せる（Bug 29 是正） 実験: 縦型モード追加 数値: — 系譜の段: 9-18d",""],["知見 D4","finding","描画が揺れても同じ形態が出るか",30,"docs/研究応用/執筆/知見総括表.md:58","知見: 測れたのは別のこと。描画を揃えても生成側が揺れる。判定は両方 ✅ で一致するが総リーチは揺れる 実験: A1（定規）と A2（フリーハンド） 数値: 手描き 1.01 対 1.01 → XML 1.0102 対 1.1958 m（+18 %） 系譜の段: 9-22",""],["知見 D5","finding","3/4 で描いても通るか",30,"docs/研究応用/執筆/知見総括表.md:59","知見: 通らない。系統的に腕が寝る。Tripo3D が斜め線を「奥行き」と解釈し関節の Z 差が潰れる。M2 は決定的ではないが解釈は一貫 実験: A3 を 2 回 M2 へ 数値: 真横 4/4 成功、3/4 は 0/2。M2 の再現性は関節間の合計で 8 % 系譜の段: 9-23",""],["知見 D6","finding","関節軸は決め打ちでよいか",30,"docs/研究応用/執筆/知見総括表.md:60","知見: ⭐ 関節ごとに x/y/z を指定できるようになった（旧: 平面か お辞儀の 2 択のみ）。⭐ Choreonoid の実走まで届くことを実測。⛔ ただし形状から軸を推定する処理は無い 実験: --axes を実装し実走で検証 数値: 同じ関節を曲げたとき x +414 mm ↔ y −414 mm と向きだけ入れ替わる 系譜の段: ⭐⭐ 9-131",""],["知見 D7","finding","軸を自由にすると候補が爆発しないか",30,"docs/研究応用/執筆/知見総括表.md:61","知見: ⛔⛔ 訂正（9-147）: 削減率はリンク長を凍結した前提の数字だった。⭐ 学習の設定（長さを ±0.5 m 最適化）で測り直すと Reach 4 %・Pusher 0 %。⛔ 「学習前に半分落とせる」とは言えない 実験: 81 通りを第1層で枝刈り 数値: 凍結 Reach 45 % / Pusher 41 % → ⛔ 最適化 Reach 4 % / Pusher 0 % ⛔⛔ 実験で確定（9-151）: 棄却された配置を実際に学習させたら目標まで 2.1 mm に到達した（腕が 2.42 倍に伸びた。予測は残り 164〜209 mm）。⭐⭐ 枝刈りが有効なのはリンク長を固定する設定に限られる。⚠️ 第1層の欠陥ではなく使い方の誤り — 「棄却側だけが確実」は判定と学習が同じ設計空間を見ているときにし…",""],["知見 E","theme","E. 反証・取り下げた主張（消さないこと）",1,"docs/研究応用/執筆/知見総括表.md:63","",""],["取り下げ 1","retracted","⛔⛔⛔ 9-245 以前の学習の結果すべて（順位・−36 %・タスク識別・ゴールなど）を現在の結…",38,"docs/研究応用/執筆/知見総括表.md:67","何で崩れたか: 物理の値に根拠が無く（密度 5.0・armature 1・トルク上限 400）、制御入力の上限なし（Bug 60）・減衰が ÷ 総質量（Bug 61）・対象にも armature（Bug 62）・tick の完了を待たない非決定的な物理（Bug 64）が重なっていた（系譜 9-241〜9-247） 現在: 撤回（修論 5.3 (C) で開示）。実在の値の _phys で取り直し中（付録D は 10-21 に外した。見込みの正は進捗.md「残っている実験」）。事前登録した読みで 1 本ずつ判定する",""],["取り下げ 2","retracted","⛔ KXR のサーボ s3301 は 0.73 N·m 以上出せる（9-206、キットのサンプル…",38,"docs/研究応用/執筆/知見総括表.md:68","何で崩れたか: 近藤科学の公式の最大トルクは 0.588 N·m（7.4 V）。キットが成立することは、いちばん重い部分鎖を水平に支えられることを意味しない（9-276） 現在: 取り下げ。学習には使っていない。⚠️ 軸6 のアームのサーボは XL430（10-21 ユーザー）なので、s3301 自体を使わない（軸6_スケール表 §0）",""],["取り下げ 3","retracted","⛔⛔ 配分 dist（先端が長い形）の失敗を「長さの配分がタスクに合わない」と読む（9-259 …",38,"docs/研究応用/執筆/知見総括表.md:69","何で崩れたか: Bug 72: 運動学に効かない設計変数 ext_start で、2 本目 11 のカプセルが関節の後ろへ 0.18〜0.19 m はみ出し、台座の球に 126〜129 mm 食い込んだまま学習していた。検査と図はカプセルを関節から先だけと仮定していて 0 mm と出していた（系譜 9-264）。到達の短腕も同じ穴（114 mm、9-271） 現在: 取り下げ（形の比較として読まない）。dist の 3 本と短腕の 2 本を、初期接触の門を本当のカプセルで測る設定（_cg）で取り直し中。読み ②・⑤ はその後に判定し直す。想定問答 Q27 と修論 4.4.3.3 の押しの段落も、門を直した run を見て書き直す。⚠️ 見張りが ep10 で拾えるようにした（9-272）。⭐ 10-22（9-2…",""],["取り下げ 4","retracted","⛔⛔ 障害物 Reach の seed1 は「罰を払って柱を押し通り、到達した」・柱の接触は駆動…",38,"docs/研究応用/執筆/知見総括表.md:70","何で崩れたか: Choreonoid が 5 cm より深い接触を捨てる穴（Bug 57）を通っていた。旧い物理のまま深い接触を捨てない設定だけを足すと、食い込みは 22〜38 mm で押し返され、目標に 61〜206 mm 届かない（系譜 9-274） 現在: 取り下げ。9-220 の「学習を長くすれば届く」の根拠（seed1 の最後の伸び）も崩れた。⭐ 9-144・9-161 の「避けて届く姿勢は幾何的にあるのに、学習が届かない」は残り、10-21 のユーザー決定でこれを結果として扱う（今の物理で 2 seed を回し直す、進捗 D-5）",""],["取り下げ 5","retracted","⛔ 「形は慣性にほとんど効かない（armature が 99 % 以上）」（9-47）",38,"docs/研究応用/執筆/知見総括表.md:71","何で崩れたか: 旧い設定（密度 5.0・armature 1）の話。実在の値では平面アームの根元の関節でリンク形状の寄与が 1.8〜40 %（系譜 9-253。armature 0.64 では 4.7〜64 %、9-246） 現在: 旧い設定に限定。⚠️ 慣性に帰属させる前に測る規律は同じ（CLAUDE.md ⑤-3）",""],["取り下げ 6","retracted","⛔ 「再生は毎回同じ話になる」（9-237）",38,"docs/研究応用/執筆/知見総括表.md:72","何で崩れたか: くじ（初期状態）は seed で固定されるが、物理が非決定的だった（Bug 64、同じ入力で最大 157 mm ずれる） 現在: くじについてのみ正しい。CNOID_TICK_SYNC=1 の run は物理も 2 回が 0.0 mm で一致（系譜 9-247）",""],["取り下げ 7","retracted","⛔ 軸5「密度だけ変えると +21 %」（9-136・9-146）",38,"docs/研究応用/執筆/知見総括表.md:73","何で崩れたか: Bug 59。従来の押しだけ制御コスト 0.2・接近の整形 0 で、密度・実在の押しは既定値（1e-4・1.0）。XML の差は 1 行だが比較は 3 変数（9-238） 現在: 取り下げ。密度 → 実在（−36 %）は同じ既定値どうしで 1 変数のまま。⏳ 全部の押しを同じ報酬で取り直し中（_scgc） → ⛔ 10-13 に全実験を実在の物理（_phys）でやり直すことにして「従来 対 実在」の比較そのものを外したので、_scgc の取り直しは行わない（系譜 9-246）。−36 % も旧い物理の値で、本表 1 行目の撤回に含まれる",""],["取り下げ 8","retracted","⛔ 壁の反射の実装は厳密に正しい（イベント比 0.750）（9-200・9-201）",38,"docs/研究応用/執筆/知見総括表.md:74","何で崩れたか: プローブは反射が env step の 1〜3 番目の tick で起きる場合しか試していなかった。最後の tick で起きると次の step で当て直しが切れ、速度の比が約 1.7 になる（probe_wall_hit_tick.py、Bug 70、系譜 9-263 ⑥）。学習の再生では跳ね返りの約 6 回に 1 回 現在: 訂正。直した（10-19）。⚠️ それ以前のホッケー（hockey_bank9_phys_g10 / _s2 まで）はこの物理で学習しており、取り直し中（_g10_wfix）。1 イベントの検証を実装全体の検証と取り違えない",""],["取り下げ 9","retracted","⛔⛔ ホッケーの壁に関する 8 回分の修正すべて（9-37〜9-94）",38,"docs/研究応用/執筆/知見総括表.md:75","何で崩れたか: ⭐ 壁が Choreonoid のシ  ctrl_cost で回せる",38,"docs/研究応用/執筆/知見総括表.md:91","何で崩れたか: 報酬の上限が 348 → 0.8 になったのにコストを据え置いた。実測コストは上限報酬の 29 倍 現在: 初回2本は無効。0.2 → 0.001 に逆算し直した（9-41）。⚠️ 当初案 0.01 も不足だった",""],["取り下げ 26","retracted","縦型 Pusher は A1v が突出（348 対 151・184）",38,"docs/研究応用/執筆/知見総括表.md:92","何で崩れたか: seed=1 で A2v 430.28・B2v 475.71 と逆転 現在: 順位は seed の産物。縦型 Pusher の seed 幅は 2.6〜2.9 倍（9-31）",""],["取り下げ 27","retracted","自由度は Reach では負債・Pusher では資産（9-24 起草時）",38,"docs/研究応用/執筆/知見総括表.md:93","何で崩れたか: 収束形態を実測すると縦型はリンク長も最適化され腕が約 2 倍に伸びていた。方向はリンク長だけで説明がつく 現在: 取り下げたまま。⭐ 2026-09-11 に復活条件を測って復活しなかった（9-74・9-76）。body_params: {} で長さを揃えると、Reach も Pusher も縦型が下（Pusher は縦型 [125.56, 162.05] 対 平面 [203.40, 258.98]）。「Pusher では資産」は成り立たない。 ⭐ 再生でも保たれる（縦型凍結 [53.17, 162.64] 対 平面凍結 [187.03, 245.37]）。⚠️ 平面との比較は 1 変数ではない（深さ・関節数・床チェックが同時に違う）ので「負債である」とは言わない。⚠️ 縦型凍結の Pusher…",""],["取り下げ 28","retracted","M1 は向きの指示を 4 回に 1 回破る（9-68）",38,"docs/研究応用/執筆/知見総括表.md:95","何で崩れたか: 同じ物差しで A1 は 47.5° で学習まで通り、A3 は 49.8° で止まる（差 2.3°）。2D の重心角は合否を分けない。画像を見ると 4 本とも立っている 現在: 測定は有効、推論は無効（9-79）。姿勢のばらつきは事実。⚠️ A3 を寝かせたのは M1 ではなく M2。正しい検査は check_glb_pose.py（M2 後の関節 Z 広がり、下限 0.25）で既に存在する",""],["取り下げ 29","retracted","配分の差は先端の慣性で説明できる（4.4.3.3 の解釈）",38,"docs/研究応用/執筆/知見総括表.md:97","何で崩れたか: 質量行列を比べると形の寄与は 0.42 % 対 0.55 %、差は 0.13 %。性能差 2.7 倍に対し 3 桁足りず、向きも逆（根元重の方が慣性が大きいのに勝つ） 現在: 取り下げ（9-89）。⭐ 代わりに先端リンク長で説明できる: 先端の誤差 ≒ 先端リンク長 × 関節角誤差。0.137 対 0.500 から 3.65 倍を予測し、実測 2.66〜3.18 倍と整合。⚠️ 対照実験はしていない。整合の指摘に留まる。 ⚠️ 慣性に帰属させた機序はこれで 3 回とも外れた（余裕・長さ・配分）。原因は armature が慣性の 99 % を占めること",""],["知見 G","theme","G. 現実への転用性（CAD のフェーズ0 と言えるか）",1,"docs/研究応用/執筆/知見総括表.md:99","",""],["知見 G1","finding","⭐ ① 軸決め",68,"docs/研究応用/執筆/知見総括表.md:106","以前: ⛔ 1 行の決め打ち。平面か お辞儀の 2 択 ⭐ 現在: 🟡 関節ごとに指定できる（9-131）＋枝刈りで候補を半減（9-127） 残り: ⛔ 形状からの推定は無い。⛔ 枝刈りの妥当性も未検証 ⭐ 2026-10-05: 形状からの推定アルゴリズムは作らないと決定（研究方針.md「残り期間でやること／やらないこと」）。",""],["知見 G2","finding","⭐⭐ ③ 組めるか（助教 指摘9）",68,"docs/研究応用/執筆/知見総括表.md:107","以前: ⛔ 設計空間が連続で、出た解が実在の部品で組めるとは限らない（5.3 (A)） ⭐ 現在: 🟡 軸6 として計画（2026-10-02・10-05）: RobotAssembler（KXR）の部品で、β（部品で作れる範囲で長さだけ学 たら、帯が重なった（可動 [−18.23, −11.73] 対 固定 [−19.99, −12.05]。9-169）。⭐⭐ 採否手続き 3.12.4 は実在条件でも設計どおり働いている（帯が重なる候補は採用しない）。⛔ 「閉ループが閉じた」とは言わない — 閉じる相手が出ず、手製の候補も落ちた。⚠️ 9-119（旧条件・12 %）は帯が分離したが実在条件では再現せず。形態も設計空間も違うので優劣の話ではない",""],["知見 F4","finding","⛔⛔ 障害物の回避と到達が両立しない",76,"docs/研究応用/執筆/知見総括表.md:154","状態: 接触ペナルティを入れると 2 seed が正反対になった（9-159）。seed0 は柱を完全回避（0/1201）だが未到達 210 mm、seed1 は到達 7 mm だが柱の中に 1187 step。⭐ 9-144 は幾何的に両立解が 21244 個あると示しているのに、⛔ 学習はどちらか一方の局所解に落ちる。⚠️ 「報酬で罰すれば避ける」は 2 seed では言えない ⭐⭐ 分解した（9-161）: 報酬は seed1（罰を払って到達）の方が高い（−111.7 対 −227.1）＝ 罰が弱い。⛔ だが係数を 3.8 倍にしても「回避して未到達」が勝つだけで両立解には近づかない。⭐⭐ 両立解は 24 % もあるのに探索が届かない ＝ 判定器は正しく制御が限界という事例（5.6.2 と同型）。⭐ した…",""],["知見 F5","finding","⛔⛔ 腕のリンクが床より下に出る run がある",76,"docs/研究応用/執筆/知見総括表.md:155","状態: 軌跡 36 本を図にしたら 10 本で床下（9-155）。7 本は台座（運動学に無関係。9-154）だが、⛔ 3 本は動くリンク。⛔⛔ 密度条件 seed0 は肘が床に 264 mm 埋まったまま 98 % の step 動いている。⭐ 床を使わなかった seed1 の方が成績が高い（449.35 対 417.56）ので、密度が対照を上回る結論はきれいな seed 単独でも成立する。⚠️ 床が腕と衝突しているかは未解明（9-98・9-133・9-143 と同じ型の可能性）",""],["知見 F6","finding","⛔⭐ 台座リンクが運動学に寄与しないのに最適化されている",76,"docs/研究応用/執筆/知見総括表.md:156","状態: リンク1 は台座の先ではなく根元から始まる（no_root_offset）。⛔ 設計変数 10 次元のうち 2 次元が運動学に無関係で、勾配が来ないので自由に振れる（9-154）。⚠️ geom は実在するので床と交差する（1 run で 270 mm 埋まっていた）。⭐ 9-148 の「18 中 16 で反転」の一因。⚠️ 数値の検査は 5 項目とも通っており、図にして初めて見つかった",""],["知見 F7","finding","⛔⛔ 軌跡は「読み込み直後の 1 話目」しか記録していない（Bug 47）",76,"docs/研究応用/執筆/知見総括表.md:157","状態: 対照 Pusher の cube 移動は 1 話目 15.11 m に対し 3〜6 話は 6.54〜15.97 m（幅 144 %）。⭐⭐ 軌跡を反復しても検出できない（毎回 1 話目をやり直すだけ）。⛔ これにより 9-140「報酬は上がるが移動量では区別できない」と 9-138「Pusher は決定的」を取り下げた（9-142）。⭐ 正しく測ると密度は平均 12.82 → 17.20 m（+34 %）で報酬の +20 % と整合する。⚠️ 帯は依然重なるので「平均は上がる」までしか言えない。⚠️ check_before_conclusion の達成判定は依然 1 話目に乗っている",""],["知見 F8","finding","⛔⛔ 固定 body があるタスクは再生ごとに結果が揺れる",76,"docs/研究応用/執筆/知見総括表.md:158","状態: 同じ checkpoint・同じ初期位置でも、ホッケーの目標距離が 118 / 64 / 308 mm、障害物 Reach が 0.16 / 11.84 / 1.81 mm（幅 254 %）。⭐ Reach と Pusher は 0 %（完全に決定的） — 揺れるのは固定 body と接触するタスクだけ（9-138）。⛔ 1 エピソードで達成を判定できない。check_before_conclusion.py に警告を入れた。⚠️ 機序は未検証 ⛔ 訂正（9-142）: 「Reach と Pusher は 0 %」は誤り。反復の単位が「1 話目のやり直し」だったので揺れが見えなかっただけ（対照 Pusher は 6 話で幅 144 %）",""],["知見 F9","finding","⛔ 軌跡の既定が 400 step でエピソードの 27〜65 % しか無かった",76,"docs/研究応用/執筆/知見総括表.md:159","状態: Bug 46 / 9-137。既定を 1200 にし、判定対象が末尾でまだ動いていれば警告するようにした。⭐ Pusher は対象が 400 step で止まるので 9-136 は無傷だった",""],["知見 F10","finding","⛔⭐ 柱の接触が駆動トルクに負ける（Bug 45）",76,"docs/研究応用/執筆/知見総括表.md:160","状態: ⛔⛔ 2026-10-21（9-274）: 「負ける」の中身は、5 cm より深い接触を Choreonoid が捨てていたこと（Bug 57。旧い物理では食い込みが 51〜53 mm で頭打ち）。深い接触を捨てない今の物理（CNOID_CULLING_DEPTH=1.0）では柱に押し返される。下は当時の記録 → ⛔ 未修正。⭐ 柱は腕に当たる（柱が無いと 27/60 入り込む姿勢で、柱があると 0/60。9-133）。⛔ しかし gear 100 で駆動された腕は押し込まれ、深く食い込むと押し出されない。⭐ 方策は最初 6 step 柱を避けて回り込んでおり、回避自体は学習されている。⭐⭐ 2026-09-25（9-167）: 主戦場の Pusher を確かめた。⭐ 通り抜けは無く（主要 7 本すべて…",""],["知見 F11","finding","⚠️ 狭い可動域は「実機なら届く形態」を棄却しうる",76,"docs/研究応用/執筆/知見総括表.md:161","状態: ⭐ ±90° は実機の曲げ軸より狭い（9-134）。⭐ 第1層の判定には影響しない（87 ケースで 0 件）が、⛔ 「棄却側だけが確実」という保証（9-78）はシミュレータの中でのみ成り立ち、現実に対しては成り立たない。⚠️ 学習への影響は未測定",""],["知見 F12","finding","⛔ 枝刈りの妥当性が未検証",76,"docs/研究応用/執筆/知見総括表.md:162","状態: 棄却された軸配置を実際に学習して「本当に届かない」ことを示していない（9-127）。⭐ 「棄却側だけが確実」は 9-78 の設計だが、軸を変えた場合の確認はこれから",""],["知見 F13","finding","⚠️ 床より下へ伸びる形態を設計空間が許す",76,"docs/研究応用/執筆/知見総括表.md:163","状態: 収束形態の台座が 床下 237 mm まで伸びていた（9-132）。⚠️ 衝突の失敗ではなく body_params.offset ±0.5 m の仕様。⭐ 判定器は何も言わない — 第1層の検査項目にする価値がある（未実装） ⭐ 2026-10-05 一部対応: ホッケーに限り、第2層が学習後の形で「全リンクが床より上」の構えを数える（9-216）。",""],["知見 F14","finding","⛔ ホッケーは打ち切った（9-93） 反発係数の是正は成功していた（パック単体は跳ね返る）。真因…",76,"docs/研究応用/執筆/知見総括表.md:164","",""],["知見 F15","finding","⭐ Target-Pusher の報酬が飽和している",76,"docs/研究応用/執筆/知見総括表.md:165","状態: 理論上限 0.5 に対し実測 0.450 / 0.490 ＝ 上限の 90〜98 %（9-88）。2 seed の差 0.04 は上限の 8 %。「達成できたか」は言えるが「どちらが良いか」は言えない。 ⚠️ 今後 TP で形態を順序づけることはできない（既存の主張は無傷。TP の役割は形態の収束と行動の分離であって順位づけではない）",""],["知見 F16","finding","統計的検定",76,"docs/研究応用/執筆/知見総括表.md:166","状態: 各条件 1〜2 seed。検定は行わない立場を維持。⚠️ n=2 で帯が離れても、同一分布から 2 対 2 が完全分離する確率は 1/6 ≒ 17 % ある。主張は「2 seed で一貫」＋力学的説明に限定する（想定問答 Q7・Q14）",""],["知見 F17","finding","E2E（手描き→判定の通し）",76,"docs/研究応用/執筆/知見総括表.md:167","状態: 5 枚描き 4 枚通過（真横 4/4、3/4 アングルは 0/2 で失敗＝9-23）。手描き由来の学習も 4 例完走",""],["知見 F18","finding","M1・M2 の自動呼び出し",76,"docs/研究応用/執筆/知見総括表.md:168","状態: 未実装（Web UI 経由）。限界節に記載",""],["知見 F19","finding","利用者評価",76,"docs/研究応用/執筆/知見総括表.md:169","状態: 未実施",""],["知見 F20","finding","第3層の閾値較正（UNUSED_FRAC=0.10）",76,"docs/研究応用/執筆/知見総括表.md:170","状態: ❌ 決着（9-70、2026-09-10）: 2 seed では答えられない。 Pusher の seed=1 で向きが反転（seed0 +24.1 % → seed1 −34.1 %）。固定側の帯が 1.93 倍に開き可動側（1.02 倍）を飲み込む。Reach は帯の内側。限界として書く。 ⚠️ 9-32 自身が「A1v の帯が狭いことは fix4 の帯が狭いことを意味しない」と警告しており、その警告が的中した",""],["知見 F21","finding","ホッケー（壁つき・反射）",76,"docs/研究応用/執筆/知見総括表.md:171","状態: ⛔ 成立させられなかった。⚠️ 理由は 3 段階で変わった: ①報酬が経路を区別しない（9-77）→ ②報酬は区別するが到達しない → ③⭐ 既定の接触が反発しない。バンクショットは物理的に存在しなかった（9-80 訂正。反発係数 0.15、実物のエアホッケーは 0.6〜0.8）。probe_shot_geometry.py の「反射解 10〜12 本」は鏡面反射の仮定に基づく幾何の解だった。 ⚠️ 「タスクが成立する物理か」を確かめないまま 6 回いじっていた（9-77 ⑥ の第 3 の失敗類型の 3 例目）。打撃自体は学習できている（1.42 m/s） ⭐⭐ 2026-10-05 追記: ③ は解消した（反発は速度の反射で 0.750、9-200・9-201）。現状は上の「ホッケーは打ち切った」の行…",""],["知見 F22","finding","パイプライン出力の非平面での識別",76,"docs/研究応用/執筆/知見総括表.md:172","状態: 縦型 A1v・A2v・B2v が完走（9-29）。⚠️ 押しの順位は seed で入れ替わる（9-31）。⭐ 縦型の押しの高さはリンク長に依存していたと確定（9-76。長さを凍結すると 348.56 → 125.56 で帯が分離）",""],["知見 F23","finding","診断コードと結論の不一致",76,"docs/研究応用/執筆/知見総括表.md:173","状態: ✅ 2026-09-07 解消。余裕 10 % の上乗せを撤去し最小変更のみ返す（9-30）。助言は 2.19 → 1.99 倍",""],["修論 要旨","chapter","要旨 （修士論文）",2,"docs/研究応用/修論ドラフト/要旨.md:1","ドラフト管理: 初稿 2026-07-16。本文ドラフト（第1〜6章）に基づき作成。 （空欄: …） = 実験進行中の項目。数字は確定値のみ記載。 これが提出用（A4 1頁）。 圧縮前の 4,497 字版は 要旨_詳細版.md にあり、 中間発表の配布資料・指導教員への説明に使う。数値を直すときは両方を直すこと。 ⛔⛔ 2026-10-13（系譜 9-246）: 本文の結果の数値と主張（順位の反転・タスク識別・−36 % など）は旧い物理（撤回、修論 5.3 節 (C)）のもの。全実験を実在の値で取り直しており、D-6 で差し替える。 ⭐ 2026-10-19（ユーザー判断）: 要旨に結果の数値を入れない（先輩の修論の概要にそろえ、評価で何を確かめるかを書く）。「新規性」の語は使わず「本研究の特徴は」に弱めた。…",""],["修論 第1章","chapter","第1章 序論",2,"docs/研究応用/修論ドラフト/第1章_序論.md:1","ドラフト管理: 初稿 2026-07-13 → v3（学術文体・漏斗型論理展開に整形）→ v4 2026-07-22（口語表現の排除・章構成参照を実ファイル構成(全6章)に整合） → v5 2026-08-07（査読フィードバック反映: 用語の学術化・論理接続の補強） → v6 2026-08-07（主従関係の明確化: システム開発が主目的、co-design はその検証エンジン）。 （空欄: …） = 実験結果待ち。 ⛔⛔ 2026-10-14 追記（系譜 9-246・9-254）: 1.3 節の貢献 2・3 が述べる学習の結果（形の分化・順位の入れ替わり・閉ループ）は旧い物理（撤回、5.3 節 (C)）のもの。全実験を実在の値で取り直しており、D-6 で差し替える。 ---",""],["修論 1.1","section","1.1 背景",101,"docs/研究応用/修論ドラフト/第1章_序論.md:11","近年のロボット工学分野においては、人工知能（AI）を活用したソフトウェア開発の高速化が顕著である。特に生成 AI の発展により、制御アルゴリズムやタスク実行ロジックの実装は、迅速なプロトタイピングが実現可能な水準に到達しつつある。しかし、これらのソフトウェアを検証するための物理シミュレーション用機体モデルの設計プロセスは、依然として高度な専門知識を要する領域に留まっている。検証用モデルを CAD ソフトウェア等で構築するには、関節可動域の定義、回転軸の指定、質量特性の算出といった機械工学の専門知識が要求され、ハードウェアを専門としないソフトウェアエンジニアにとって開発上の大きな障壁となっている。ソフトウェア開発側の「迅速な検証環境の構築要求」に対して、機体モデルの供給速度が追いつかないという非対称性が、ロボット…",""],["修論 1.2","section","1.2 既存技術の課題と本研究のアプローチ",101,"docs/研究応用/修論ドラフト/第1章_序論.md:17","専門知識を前提としない直感的な入力形式の一つが、手描きスケッチである。画像から三次元形状を生成する技術（image-to-3D）の発展により、スケッチから三次元メッシュへの変換自体は既存技術で実現可能である。しかし、一般的な image-to-3D モデルが出力するデータは単一の連結メッシュであり、ロボットのシミュレーションに不可欠な可動構造情報（リンクの分割境界、関節座標、回転軸ベクトル等）は内包されていない。点群データから学習ベースで関節構造を推定する手法も提案されているが、その評価は可動部品の少ない日用品に限られ、ロボットの形態での精度は示されていない（2.2 節）。 仮に可動構造を備えたモデルが生成されたとしても、当該モデルのリンク長やアクチュエータ出力が対象タスクに対して妥当であるかは先験的には決定で…",""],["修論 1.3","section","1.3 本研究の目的と成果",101,"docs/研究応用/修論ドラフト/第1章_序論.md:39","本研究の目的は、ハードウェアの専門知識を持たない開発者が、手描きスケッチから出発してロボット形態のタスク適性を即座にシミュレーション検証できる環境を構築することである。 実証題材には卓上エアホッケーを用いる。ただし、本研究の対象はエアホッケーそのものではなく、同題材から抽象化した到達と押しの二タスクである（題材に近い打ち込みは 4.7 節で扱う）。平面内のアームで、位置決めと運動量伝達という異なる要求を表現でき、形態とタスク要求の対応を比較しやすいため、この題材を採用した。把持を含むタスクは接触形状や指の構造が主要因となり、リンク長と関節位置を扱う本パイプラインの検証範囲を超える。設計工学では、製品の設計過程を、構成と動作原理の大枠を定める概念設計から、寸法と部材を確定する詳細設計までの段階に分ける。本システム…",""],["修論 1.4","section","1.4 本論文の構成",101,"docs/研究応用/修論ドラフト/第1章_序論.md:53","本論文の構成は次の通りである。第2章で関連研究を概観し、本研究の位置づけを明確にする。第3章前段で前提となる Stackelberg PPO の枠組みと用語を整理し、第3章で手描きスケッチから co-design 学習起動に至る提案パイプラインの構成を述べる。第4章で、実験条件（原論文の枠組みを据え置き型アームへ移したときの問題と対処を含む）、統制実験によるタスク識別と順序づけの実証、判定所要学習量の較正を統合して報告する。第5章で結論と今後の課題を述べる。本研究の限界は5.3 節に集約した。 ---",""],["修論 第2章","chapter","第2章 関連研究",2,"docs/研究応用/修論ドラフト/第2章_関連研究.md:1","ドラフト管理: 初稿 2026-07-13 → v2 2026-07-22（全書誌情報を確認済み文献に置換・文体推敲）。 v3 2026-08-04（2.4「タスク適合性の判定と設計へのフィードバック」を新設・旧2.4を2.5へ） → v4 2026-08-07（査読フィードバック反映: 用語の学術化・決定論主張のトーン調整・可操作性の追加・表2.1の名詞止め化） → v5 2026-08-07（2.3 の未検証課題を「判定器として転用する用途から導かれる前提要件」へ再構成。2.5 を「3領域の一気通貫結合」を主張する構成へ）。 本研究の関連領域は「設計の障壁を低減する入力インタフェース」「三次元形状からの可動構造推定」「形態-制御 co-design」 「タスク適合性の判定と設計へのフィードバック」の4系統に…",""],["修論 2.1","section","2.1 スケッチによる三次元モデリング — 設計の障壁を低減する試み",106,"docs/研究応用/修論ドラフト/第2章_関連研究.md:12","CAD アプリケーションの複雑さと学習コストの高さは、初学者による三次元設計の大きな障壁として古くから認識されており、その代替として手描きスケッチを入力とするモデリング手法が研究されてきた。先駆的なシステムである Teddy（Igarashi et al., 1999）は、ユーザが描いた2次元の輪郭線を膨張させて3次元形状を生成するインタフェースを提示し、専門知識のないユーザでも直感的に形状を作成できることを示した。以降のスケッチベースモデリング研究の系譜は Olsen et al.（2009）のサーベイに整理されており、深層学習の導入以降の展開は Tono et al.（2026）のサーベイに引き継がれている。近年では、単一のフリーハンドスケッチから3次元形状を復元する手法や、スケッチ列から CAD 操作列を…",""],["修論 2.2","section","2.2 三次元形状からの可動構造推定",106,"docs/研究応用/修論ドラフト/第2章_関連研究.md:20","スケッチや画像から得られる三次元形状は、単一の連結メッシュであり、リンクの区切り・関節位置・回転軸といった可動構造の情報を含まない。この欠落を補うため、三次元形状から可動構造を推定する研究が近年活発化している。URDF-Anything（Li et al., 2025）は、点群データに対して 3D マルチモーダル大規模言語モデル（3D-MLLM）を用いてパーツのセグメンテーションと関節パラメータの推定を統合的に行い、ロボット記述ファイル（URDF）を直接生成する。対象は扉の回転や引き出しの直動のような関節を持つ家具・家電などの可動物体であり、学習と評価に用いたのは可動部品が 8 未満の物体に限られる。同研究は、セグメンテーションの精度（mIoU）で既存手法を上回ることを報告し、生成した記述をシミュレータ上で動か…",""],["修論 2.3","section","2.3 形態-制御 co-design",106,"docs/研究応用/修論ドラフト/第2章_関連研究.md:30","ロボットの形態と制御を同時に最適化する co-design は、Sims による仮想生物の進化（Sims, 1994）に遡る系譜を持ち、近年は深層強化学習と組み合わせた手法が発展している。Neural Graph Evolution（Wang et al., 2019）はグラフニューラルネットワークにより形態間の重み共有を可能にし、グラフの変異による進化的探索と組み合わせて形態を探索する。Transform2Act（Yuan et al., 2022）は、骨格構造・関節属性を編集する変換行動と、その形態下での制御行動を単一の条件付き方策に統合し、形態探索自体を強化学習の枠組みに載せた。制御の学習には Proximal Policy Optimization（PPO; Schulman et al., 2017）…",""],["修論 2.4","section","2.4 タスク適合性の判定と設計へのフィードバック",106,"docs/研究応用/修論ドラフト/第2章_関連研究.md:40","前節までは「形態を作る」「形態を最適化する」系統であった。本研究がさらに扱うのは、得られた形態がタスクに適合するかを判定し、適合しない場合にその理由と修正方向を返す工程である。この工程には二つの問いがある。一つは形態がタスクに適合するかをどう判定するかであり、もう一つは適合しない場合に設計者へ何を返すかである。2.4.1 項で前者を、2.4.2 項で後者を扱い、それぞれ先行研究が何をしており何ができないかを述べ、それに対する本研究の方法を示す。各系統との差分は 2.5 節の表 2.1 にまとめる。",""],["修論 2.4.1","section","2.4.1 タスク適合性の判定",110,"docs/研究応用/修論ドラフト/第2章_関連研究.md:44","形態がタスクに適合するかを判定する手がかりとして、古典的には運動学的解析が用いられてきた。運動学的解析は、関節角とリンクの寸法だけから計算できる量で形態を評価し、質量・力・接触・制御は含まない。作業空間解析は手先がどの位置にどの向きから届くかを領域ごとに求め（Zacharias et al. 2007）、可操作性はある姿勢で手先をどの方向へどれだけ動かしやすいかを測る（Yoshikawa 1985）。これらで判定できるのは、目標が届く範囲の内側にあるかどうかまでである。届く形態がタスクを達成できるかは、接触を伴う動力学（対象を押すときの運動量の受け渡し、対象の摩擦と質量）と、形態が原理的になしうることを制御が実際に引き出せるかで決まり、どちらも運動学の外にある。 タスクから形態を導く研究もある。Ha et al…",""],["修論 2.4.2","section","2.4.2 設計へのフィードバック",110,"docs/研究応用/修論ドラフト/第2章_関連研究.md:52","適合しない場合に設計者へ何を返すかについては、設計支援に説明可能性を持ち込んだ研究がある。Klar et al. (2024) は、強化学習による工場レイアウトの生成に、方策の要約・摂動・状態価値の分析といった説明手法を付け、計画者が結果を理解し信頼できるようにした。説明の対象は学習器が何を学んだかであり、設計者が次に何を変えればよいかは返さない。 何を変えればよいかを返す形式は、説明可能 AI において反実仮想説明（counterfactual explanation）として定式化されている。Wachter et al. (2018) は、モデルの内部を開示せずとも「入力がどう違っていれば結果が変わったか」を示せば説明として機能すると論じ、その中心に判定を覆すのに必要な最小の変更を置いた。ただし、最小の変更が…",""],["修論 2.5","section","2.5 本研究の位置づけ",106,"docs/研究応用/修論ドラフト/第2章_関連研究.md:62","以上の4系統に対する本研究の差分を、表 2.1 に整理する。表は各要素技術との関係を示すものである。 表 2.1: 関連4系統に対する本研究の差分 本研究の主張は、スケッチからの形状生成、形態-制御 co-design による動作検証、判定結果に基づく設計へのフィードバックを、専門知識を持たない設計者が利用できる一つのパイプラインとして接続したことである。形状生成と構造抽出（2.1・2.2）、co-design（2.3）、診断とフィードバック（2.4）はそれぞれ既存研究に基づくが、本研究ではこれらを同じ入力から判定と修正指針までつなげる。 接続を阻むのは、1.2 節の三つの壁のうち、可動構造の情報が無いこと（1）と、不適合と分かっても直し方が分からないこと（3）である。本研究では前者に関節マーカー規約を、後者に…",""],["修論 3.1","section","3.1 問題設定: 階層ゲームとしての co-design",118,"docs/研究応用/修論ドラフト/第3章前段_前提.md:11","Stackelberg PPO は、形態と制御の同時最適化を Stackelberg ゲーム — 先導者（Leader）が追従者（Follower）の最適応答を見越して意思決定する階層ゲーム — の変種として定式化する。Leader は形態を編集する方策 $\\pi^L(\\cdot \\mid s^L_t; \\theta^L)$、Follower は確定した形態のもとで制御を行う方策 $\\pi^F(\\cdot \\mid s^F_t; s^L_T, \\theta^F)$ である。 ここで $\\pi(\\cdot \\mid \\ldots)$ は、縦棒の右の条件のもとで各行動をとる確率を返す関数を表し、セミコロンの右はその方策を用いるあいだ固定される量である。各記号の意味を表 3.1 に示す。すなわち $\\pi^F$ は、…",""],["修論 3.2","section","3.2 役割別の報酬設計に関する原論文の規定",118,"docs/研究応用/修論ドラフト/第3章前段_前提.md:42","原論文の付録は、報酬項を Leader と Follower に選択的に割り当てる「役割別の報酬設計」を明示的に許容している — 例えば材料コストや複雑さのペナルティを Leader の更新のみに適用し、制御学習には干渉させない、という使い方である。重要なのはその境界であり、Leader 専用の報酬項を $J^L$ に加算することは枠組みの想定内だが、$J^L$ の第2項（Follower リターンの継承）を別の量に置き換えることは、Leader が Follower の実応答を見なくなるため Stackelberg 構造の前提を壊す。本研究の報酬設計（4.1.2 項）はこの規定に従う。",""],["修論 3.3","section","3.3 方策のアーキテクチャ",118,"docs/研究応用/修論ドラフト/第3章前段_前提.md:46","方策ネットワークは、形態を木構造（ボディグラフ）として扱う Transformer ベースの構成であり、グラフ構造を意識した位置符号化を用いる。各ボディがノードとして観測（深さ・設計パラメータ・シミュレーション状態）を持ち、行動（形態編集・制御）もノード単位で出力される。この構成の実用上の帰結として、リンク数の異なる形態を同一のネットワークが透過的に扱える — 本研究で生成メッシュ由来の3関節アームがコード変更なしに受理されたのはこの性質による（4.3.1 項）。",""],["修論 3.4","section","3.4 本研究で用いる実装上の構成",118,"docs/研究応用/修論ドラフト/第3章前段_前提.md:50","本研究の実験は、上記の枠組みに次の構成を加えて実施する（いずれも原論文の枠組みの範囲内の設定である）。 - 形態フェーズの分割: 実装では Leader フェーズがさらに骨格変換（リンクの追加・削除）と属性変換（リンク長・ギア比等の連続量編集）に分かれる。本研究ではトポロジーをスケッチ由来の構造に固定するため骨格変換を無効化する。骨格変換の段は 1 ステップで素通りし、属性変換を 5 回行う - 設計パラメータの写像: 属性変換の行動は正規化空間 $[-1, 1]$ 上で行われ、正弦写像により実パラメータの探索範囲へ変換される。探索範囲は表 4.1 の通りであり、実在の部材と実在のアクチュエータ（UR5e）から導いた（表 4.2）。1回の編集の歩幅は係数で制御され、これは探索範囲の制限ではなく更新の刻み幅である…",""],["修論 第3章","chapter","第3章 提案手法: スケッチ起点の形態検証パイプライン",2,"docs/研究応用/修論ドラフト/第3章_提案手法.md:1","ドラフト管理: 初稿 2026-07-13 → v2 2026-07-22（実装環境節を追加・文体推敲・[要チェック]注記の解消） → v3 2026-08-06（節番号を 3.1〜3.9 から 3.5〜3.13 へ繰り下げ）。骨子の第7章（システム）に相当する内容を「提案手法」として執筆したもの。 ⚠️ 第3章前段_前提.md と統合して1つの第3章を構成する（案A、2026-08-06 確定）。 前段が 3.1〜3.4、本ファイルが 3.5〜3.13。統合前は両者とも 3.1〜 で番号が衝突していた。 PDF ビルド（scripts/build_thesis_pdf.py）も案Aに合わせて merge で前段と連結してある。 md の節番号は PDF では捨てられ LaTeX が振り直すので、節を動かしたら…",""],["修論 3.5","section","3.5 システム全体像",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:17","提案システムは、手描きスケッチを入力とし、その形態の対象タスクへの適性判定と、不適合であった場合の修正方向を出力する。全体の構成を図 3.1 に示す。処理は 7 つの工程（M1〜M7）からなり、図ではこれを 4 つのフェーズに分けている。 !図 3.1: 提案システムの全体構成。上段はスケッチから形態パラメータを得るまで（フェーズ 1・2）、下段はシミュレーションモデルの生成と評価・診断（フェーズ 3・4）である。色と矢印の意味は図の下の凡例に示す。{width=1.0} 各フェーズの役割は次のとおりである。 - フェーズ 1（入力・画像整形）: M1 が、固定プロンプト（関節マーカー規約）のもとでスケッチを白背景・単一視点で CAD のレンダリングを模した画像に描き直し、関節にマゼンタの球を描かせる（3.6 …",""],["修論 3.6","section","3.6 M1: 画像整形と関節マーカー規約",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:36","3.6〜3.10 節では、手描きスケッチ A1（4.6 節）を例に、各工程の途中経過を図 3.2〜3.5 に示す。 !図 3.2: M1・M2 の入出力（手描きスケッチ A1）。① 手描きスケッチ、② M1 が描き直した画像、③ M2 が生成した三次元メッシュを横から見たもの。{width=1.0} 入力スケッチは、画像生成 AI（Gemini）によって、後段の三次元化と色検出に適した画像へ描き直される（図 3.1 の M1、図 3.2 ①→②）。描き直した画像は単一の視点から CAD のレンダリングを模して描き、寸法線・文字・複数の視点を含まない。単一の視点に限るのは三次元化が 1 枚の画像を入力とするためであり、寸法線と文字を禁じるのは三次元化がそれらを立体として拾うためである。この際、本システムの中核であ…",""],["修論 3.7","section","3.7 M2: 三次元形状生成",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:52","整形済み画像は image-to-3D サービス（Tripo3D）により三次元メッシュ（GLB 形式、Y-up 座標系）へ変換される（図 3.1 の M2、図 3.2 ③）。API 経由で、生成に用いる乱数の初期値（以下、生成のシード）を固定して呼び出す。 生成サービスは出力メッシュのバウンディングボックスの最長辺を 1.0（= 1 m）に正規化する（手元の GLB 4 件すべてで 1.0000）。したがって絶対寸法は入力画像の画素数や添えた寸法に依らず、絵の中の比率だけで決まる。利用者が絶対寸法を数値で指定する手段は無く、必要なら生成後に一様な倍率を掛ける。",""],["修論 3.8","section","3.8 M3: 関節検出とリンク分割",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:58","M3 は GLB メッシュから関節位置を検出し、メッシュをリンク単位に分割する（図 3.1 の M3、図 3.3）。 !図 3.3: M3 の途中経過（手描きスケッチ A1）。①〜③ は本文の 3 つの段階に対応する。{width=1.0} まず、UV テクスチャの色を頂点に焼き込み、各頂点に色を持たせる（図 3.3 ①）。 次に、マーカーの頂点を抜き出して関節を求める（図 3.3 ②）。目標色 $c_0$ と許容幅 $\\tau$ に対し、各チャネルで $c_i^{(k)} - c_0^{(k)} \\le \\tau$ を満たす頂点をマーカーの頂点とする。生成の過程でマーカーの色は公称色からずれるため、$c_0$ と $\\tau$ は固定せず、マゼンタの色相域（285〜345°）にある頂点クラスタの中央値と広がり…",""],["修論 3.9","section","3.9 M4: 形態パラメータ抽出",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:70","分割された各リンクから、co-design の設計変数の初期値を求める（図 3.1 の M4）。結果は topology.json に書き出す。A1 での結果を図 3.4 に示す。 !図 3.4: M4 の抽出結果（手描きスケッチ A1）。各リンクの頂点を、骨の軸に沿った距離（縦軸）と骨からの距離（横軸）で描いた。破線が骨の軸、▲がそのリンクの関節、黒線が抽出した長さと半径によるカプセルである。{width=1.0} 骨の軸は M3 の関節座標から決まるので、長さと半径はその軸に沿って測る。 - リンク長 $L$: 関節と関節の距離（M3 が保持する関節座標から求める。先端リンクは最後の関節から最も遠い点まで。図 3.4 の破線） - カプセル半径 $r$: 骨の軸に垂直な断面の 2 方向の幅の平均の半分（図 …",""],["修論 3.10","section","3.10 M5: シミュレーションモデル生成",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:83","topology.json は MuJoCo 互換 XML へ変換される（図 3.1 の M5）。各リンクをカプセルで近似し、子を親の先端に取り付ける入れ子の構造にして、関節とアクチュエータ（ギア比）を付ける（図 3.5 の右）。学習側では読み込み時に Choreonoid のモデル形式（.body）へ変換される。形態を可変長のグラフとして扱う Transformer 方策のため、3 関節メッシュ由来のモデルは学習系のコードを変えずに受理された。⚠️ ただし前段（M1〜M3）を 3 関節以外で実行した事例は無く、M3 が検出した関節はどれも 3 つである（縦型モードは根本に旋回関節を 1 つ足して 4 関節にする）。 !図 3.5: M5 が生成したモデル（手描きスケッチ A1、縦型モード）。左は初期姿勢（全関…",""],["修論 3.11","section","3.11 M6: co-design による評価・補正と判定",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:91","生成されたモデルを初期形態として Stackelberg PPO による形態-制御 co-design を実行する（図 3.1 の M6）。エピソードは骨格変換（本システムではスキップ: トポロジーはスケッチが決める）、属性変換（Leader が設計変数を編集。編集する量は表 4.1）、実行（Follower が制御してタスク報酬を得る）の 3 フェーズから成り、Leader の目的関数には Follower の実行リターンが継承される。したがって学習の進行に伴い、(i) 実行リターンの推移がその形態系列のタスク達成度の評価を、(ii) Leader による設計パラメータの更新がスケッチ由来の初期値の補正を与える。判定は学習曲線の順位で読む。所要学習量は 4.6.3 節で較正する。",""],["修論 3.12","section","3.12 M7: 形態診断",118,"docs/研究応用/修論ドラフト/第3章_提案手法.md:95","M7 は、不適合の原因と修正の方向を言語化して返す。追加の学習を要さず、M6 が生成する既存の成果物のみを入力とする。診断に生成 AI は用いず、閾値との比較で選んだ定型文に実測値を差し込んで返す。",""],["修論 3.12.1","section","3.12.1 三層構造",126,"docs/研究応用/修論ドラフト/第3章_提案手法.md:99","M7 は三つの層から成る（表 3.2）。第1層が用いるリンク長と目標位置は学習の結果にも乱数シードにも依らないのに対し、第2層・第3層が用いる学習の帰結はシードや打ち切りに依存する。そこで、総合判定（「この形ではタスクを達成できません」）を出すのは第1層だけとし、第2・3層は観察の報告に留める。図 3.1 の 2 つのひし形が、学習の前の第1層と学習の後の第2・3層に当たる。 表 3.2: 診断の三層 第1層の倍率は切り上げる（四捨五入では提示値が必要量を下回り、従っても判定が覆らない場合がある）。最小の変更のみを返すことは、反実仮想説明・実行可能なリコースの要件と一致する（2.4 節）。リンク長の総和が到達半径に等しいのは、各関節が直前のリンクの先端にあり、かつ平面アームである場合に限られるため、前者が破れた…",""],["修論 3.12.2","section","3.12.2 第3層の閾値は判定規則ではなく候補生成器である",126,"docs/研究応用/修論ドラフト/第3章_提案手法.md:115","第3層の閾値（可動域の 10 %）は実験によって較正されていない（5.3 節 (D)）。ただし閾値が決めるのは「固定を試す価値のある関節」であって、「固定すべき関節」ではない。採否は、助言どおり固定した形態を学習させ、元の形態と成績の範囲が重なるかどうかで決める（4.2.2 項の基準。結果は 4.5.5 項）。したがって閾値が不正確でも誤った助言は採用されないが、有効な助言を見落とす可能性は残る。本手法が秒で返すのは候補であって、採用の結論ではない。 ---",""],["修論 第4章","chapter","第4章 実験および評価",2,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:1","ドラフト管理: 初稿 2026-07-13。骨子の第5章（タスク識別）・第5章（高速化）・第7章の実証部分を「実験および評価」として統合したもの。章番号は最終構成で調整する。 一次データ: single_run//log/log_train.txt・.hydra/overrides.yaml（設定の ground truth）・checkpoint 実測（形態比較.md）。 執筆方針: 事実の報告に徹し、解釈は最小限に留める（考察は第5章相当へ）。（空欄: …） = 実験進行中。 v2 2026-08-07（査読フィードバック反映: 実験ノート的表現の排除・ハイパーパラメータ表の新設・「頑健」の抑制）。 ⛔⛔ 2026-10-13（系譜 9-246）: 方法（4.1）は実在の物理の値（表 4.2、_phys）に…",""],["修論 4.1","section","4.1 実験環境と共通設定",129,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:16","物理エンジンには Choreonoid（AIST シミュレータ）を用い、Stackelberg PPO の公式実装を Choreonoid 環境へ移植したものを学習系とする。",""],["修論 4.1.1","section","4.1.1 使用ロボットと環境",130,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:20","検証に用いるロボットは、提案パイプラインが生成メッシュから自動構築した水平3関節の固定根本アームである（図 4.1 (a)、4.3.1 項）。形態対・形態集合の比較（4.4.3 節・4.5 節）には、これを一律に拡大・縮小した形態と、総リーチを保ったままリンク長の配分だけを変えた形態を用いる（図 4.1 (b)）。構成は次の通りである。 - 基部: 球体（半径 0.1 m）を高さ z = 0.15 m で世界座標に固定する。ロボットは移動できない - リンク: カプセルの直列3リンク（長さ 0.20〜0.30 m・半径 0.032〜0.045 m。M4 が生成メッシュから抽出した値）。質量は肉厚 2 mm のアルミニウム合金パイプとして与える（表 4.2） - 関節: 3関節とも Z 軸まわりのヒンジ関節（可動…",""],["修論 4.1.2","section","4.1.2 タスクと統制条件",130,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:71","タスクは次の2種である。いずれもタスクの報酬は単一項の単純な形とし、これに両タスク共通の制御コストを加える。項を足すと、報酬が特定の腕に合わせた調整になるか対象が動かない方策に落ち、形態の評価が働かなくなるためである。 到達の目標と押しの対象は、いずれも短腕を除く形態の届く範囲の内側に置く（図 4.1 (b)）。 制御コスト: 両タスクとも、報酬から制御入力の二乗の平均に係数 0.2 を掛けた値を引く。平均の分母には対象の 2 つのスライド自由度も入るので、1 関節あたりの重みは 0.2/(関節数 + 2)（水平 3 関節で 0.04、縦型 4 関節で約 0.033）で、原論文（0.1）と同じ桁である。比べる形態どうしでは重みが等しいので、順位の比較には影響しない。 実証題材に近いエアホッケー（4.7 節）は、…",""],["修論 4.1.3","section","4.1.3 学習ハイパーパラメータ",130,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:88","実験で使用した学習ハイパーパラメータを付録D の表 D.1 に示す。値は原論文の公開実装の既定値であり、乱数シードと最大エポック数は実験ごとに示す。形態の元になった画像整形と三次元形状生成で用いた外部サービスのモデルと実行の仕方は、実験ごとに表 D.2 に示す。 学習率スケジュールを減衰なしとしている点は、4.6.3 節 で述べる判定所要学習量の較正において重要である。 最大エポック数に比例して学習率が変化する設定であれば、短期打ち切りの試行と長期試行とで 同一エポックの状態が一致しなくなるためである。",""],["修論 4.2","section","4.2 評価の枠組み",129,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:96","評価は 4 つの軸に分けて行う。軸1 モデル生成（4.3 節）は、生成 AI が出力する三次元形状からシミュレーション用のモデルが生成されるかを、軸2 検証エンジン（4.4 節）は、形態-制御 co-design が判定器としての要求仕様を満たすかを、軸3 診断（4.5 節）は、返す修正指針に従うと形態がタスクを達成できる状態へ移るかを、軸4 統合（4.6 節）は、入力から判定までが一つのシステムとしてつながるかと、一巡に要する時間を問う。学習を用いる軸2・軸3 について、何を確かめるか（4.2.1）と、結果をどう判定するか（4.2.2）を本節で定める。軸1・軸4 の評価の仕方は、それぞれの節の冒頭で述べる。",""],["修論 4.2.1","section","4.2.1 検証エンジンに課す要求仕様",134,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:100","検証エンジンの評価は個別のアルゴリズム評価ではなく、システムの中核に据えた検証エンジンが要求仕様を満たすかを確かめる一連の検証である。要求仕様は、co-design を自動設計の手法としてではなく判定器として用いるという用途から導かれる（第1章 1.2 節、第2章 2.3 節）。以下の4項目に整理できる。 R1（前提）: ???（R1 の言い方は、R1 の判定〔10-24 以降〕の後に書く）。エンジンが形態を評価するという枠組み自体が意味を持つための前提である。形態を固定しても制御だけで同等の性能が出るのであれば、形態の良否を論じる基盤がない。 R2（妥当性）: タスクの要求を形態に正しく反映すること。判定器はタスクごとに異なる答えを返さなければならない。同じ形態集合に対してどのタスクでも同じ順位を返すのであれ…",""],["修論 4.2.2","section","4.2.2 評価指標と順位の判定",134,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:127","評価指標は次の3系統を用いる。 1. タスク性能: 実行フェーズの1エピソード合計報酬（exec_R_eps）。学習を通じた最良値（最良チェックポイント）を各試行の代表値とする。最良値は約 12 話の評価を毎エポック繰り返した中の最大値なので、最後の 50 エポックの平均より高く出る（???: 差の大きさと、平均で範囲を作っても順位が変わらないかは、seed 1 の取り直し〔10-26〕の後に書く） 2. 形態: 最良チェックポイントから抽出した設計パラメータ — 各関節のギア比、リンクの太さ、リンク長の合計（総リーチ） 3. 行動: 決定論方策（平均行動）による再現実行時の物理量 — キューブ位置の時系列 $x_{cube}(t)$、先端-目標距離 $d(t)$、制御入力ノルム 順位の判定: 各条件の代表値の…",""],["修論 4.3","section","4.3 軸1: 入力からモデル生成までの頑健性",129,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:141","本節は、生成 AI の出力からシミュレーション用モデルが得られるまでの工程（第3章 M3〜M5）を評価する。この工程が確実に動かなければ、後段の判定は実行されるまでもない。",""],["修論 4.3.1","section","4.3.1 モデル生成の成立と学習系への接続",137,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:145","目的: 提案パイプライン（第3章）が人手の介在なしに、生成メッシュ由来のモデルを学習系へ接続できることを確認する。 結果: マゼンタマーカー規約で生成した画像から、関節自動検出（3関節すべて検出）、リンク分割（固定台座 + 3 リンク）、パラメータ抽出（リンク長 0.20〜0.30 m、カプセル半径 0.032〜0.045 m）、シミュレーションモデル生成、学習起動までを人手の介在なしに通した（ここで言う範囲は関節検出以降であり、画像の取得までは人手を含む。4.6.4 節）。3 関節構成のモデルは学習系にコード変更なしで受理された。",""],["修論 4.3.2","section","4.3.2 工程ごとに確認したこと",137,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:153","第3章の M1〜M5 について、検証して確認したことを表 4.5 にまとめる。いずれも工程が次段へ正しい入力を渡すことの確認であり、判定の妥当性は 4.4 節以降で扱う。 表 4.5: 工程ごとの確認事項 ⚠️ M3 の評価に用いたメッシュは 2 件であり、成功率ではなく許容幅として測っている（5.3 節 (A)）。 M4 で抽出した半径の妥当性は、カプセルが元のメッシュを覆えているかで評価した（「正しい半径」は柄とも先端とも解釈できるが、被覆は一意に定まる）。手描き入力 5 例・20 リンクで、カプセル外に出る頂点の割合は平均 21.4 % である。残る被覆誤差の主因は、傾いた腕を水平な面で分割することにある。分割面がリンク軸に対して斜めになるため、先端の分割片に関節より後ろ側の部分が入り込み、半径も小さめに…",""],["修論 4.4","section","4.4 軸2: 検証エンジンの妥当性",129,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:171","本節は、検証エンジン（形態-制御 co-design）が要求仕様 R1〜R3（4.2.1 節。R4 は 4.6.3 節）を満たすかを検証する。",""],["修論 4.4.1","section","4.4.1 R1: 形態最適化が学習に寄与すること",140,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:175","本章の学習実験はすべて「形態最適化が学習に寄与する」ことを前提とするので、まずこの前提を確かめる。押しタスクで形態更新の歩幅を実質ゼロ（$10^{-4}$ 倍）にして形態を凍結した条件と、同じ形態で形態を最適化した条件を比べる。結果は ???（R1 の判定〔10-24 以降〕の後に書く）。",""],["修論 4.4.2","section","4.4.2 R2: タスクの要求が形態に反映されること",140,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:179","同一の形態・同一の設計空間・同一の学習手法のもとで、タスクのみを変えたときに co-design の収束形態が分かれるかを問う。スケッチ由来の縦型 4 関節アーム（表 4.1・表 4.2 の設計空間。リンクの長さと向きも設計変数に含む）に到達と押しを各 2 シード課し、収束した形態を比べる。変えたのはタスクのみである。 表 4.23: タスクによる収束形態の比較（縦型 4 関節アーム、各 2 シードの最良エピソードの形態。値は 2 シードの範囲） 両タスクとも学習は成立している。押しの報酬は対象の速度なので、押した物体を追って移動できない据え置き型アームは、振りかぶって箱を打ち、腕の届く範囲を越えて箱を滑らせた（best exec_R_eps はシード 0 で 139.65、シード 1 は ???）。到達では、…",""],["修論 4.4.3","section","4.4.3 R3: 与えられた形態集合を正しく順序づけること",140,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:202","本項は、利用者が持ち込んだ形態を与えて順序づける能力（R3、4.2.1 項）を検証する。",""],["修論 4.4.3.1","section","4.4.3.1 前向き判定テスト",143,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:206","外部から与えた形態対を、学習の前に判定できるかを調べた。4.1.1 項の水平3関節アームを 0.5 倍・1.8 倍にスケールした 2 形態を用い、リンク長を固定してギア比・リンクの太さ・カプセルの後方延長のみを最適化対象とした（スケッチが骨格の比率を決め、駆動力と肉付けを co-design が調整する役割分担）。タスクは Reach（目標 0.8 m）、200 エポックである。 表 4.11: パイプライン生成形態での前向き判定実験の結果 到達可能な長腕が到達不能な短腕を約 388 上回った。長腕の 2 シードの差は ???（seed 1 の取り直し〔10-26〕の後に書く）。短腕は最後まで目標に 397 mm 届かなかった。 収束したギア比と太さは、単独では良否を示さない。到達不能な短腕のギア比は第 1 関…",""],["修論 4.4.3.2","section","4.4.3.2 マトリクス判定（3 形態 × 2 タスク）",143,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:224","目的: 4.4.3.1 節は「同一タスクで適合形態と不適合形態を判別できる」ことを示した。しかし、そこで選ばれた形態がどのタスクでも選ばれるのであれば、判定器は長さや出力の大きさだけを比較している可能性がある。本実験では、リンク長のみが異なる同じ3形態（短腕・中間スケール・長腕）を Reach と Pusher にそれぞれ与え、タスクによって順位が入れ替わるかを検証する。本論文では、このような複数形態を複数タスクで比較する実験をマトリクス判定と呼ぶ。 設定: 4.4.3.1 節の 2 形態に中間スケール（1.1 倍、総リーチ 0.887 m）を加えた 3 形態に対し、Reach（目標 0.8 m）と Pusher（速度報酬）をそれぞれ課した。リンク長は XML で凍結し、ギア比・リンクの太さ・カプセルの後方延長…",""],["修論 4.4.3.3","section","4.4.3.3 配分だけを変えた判別 — 幾何が原理的に区別できない形態対",143,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:252","目的: 4.4.3.1・4.4.3.2 の形態は、いずれも同じ配分（リンク長の比率が一定）でスケールだけを変えたものであり、最大リーチが異なるため第1層の幾何診断でも順位が付きうる。検証エンジンが幾何の外側を評価しているかを確かめるため、最大リーチが同一で配分のみが異なる形態対を用いる。 設定: 総リーチを 0.887 m に固定したまま、リンク長の配分だけを反転させた 2 形態（根元重 0.500 / 0.250 / 0.137 m、先端重 0.137 / 0.250 / 0.500 m）を用意した。形態以外の条件は 4.4.3.2 の中間スケールと同一である。 ⭐ 第1層は両形態に同一の出力を返し（いずれも「総リーチ 0.887 m」「目標は可動範囲の内側、余裕 10 %」）、この 2 形態を原理的に区別で…",""],["修論 4.5","section","4.5 軸3: 診断フィードバックの有用性",129,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:273","📝 執筆メモ（本文に残さない）: 2026-10-21（ユーザー「d-5 はあなたの案のおすすめで」）: 障害物 Reach（D-5、系譜 9-274・9-275）は本節に短い 1 項（約 0.5 ページ）として置き、5.3 節 (D) に 1 文を足す。理由: 第1層（幾何）は「柱を避けて届く姿勢がある」と答え、学習は届かない＝失敗の原因を形ではなく制御と切り分けた唯一の実例で（研究方針「失敗の帰属」、9-161）、5.3 だけに置くと表と数値が消えて弱点としてしか読まれない。項を書くときは、第1層に柱を組み込んだこと（9-144）を数行で説明する。結果は今の物理の 2 seed（e2e_a1v_obspen_reach_phys(_s2)、10-23 夜・10-24 未明に起動の見込み。正は進捗.md「残っ…",""],["修論 4.5.1","section","4.5.1 診断出力と実測順位の一致",147,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:281","⭐ 本項が確かめるのは、4.4 節が学習によって得た判定を、学習を実行せずに診断が再現できるかである。 4.4.3.2 節のマトリクス判定 6 条件（3 形態 × 2 タスク、学習後の順位が確定している）に三層すべてを適用し、出力と実測順位を突き合わせた。新規の学習は行わず、既存のチェックポイントのみを用いている。 第1層だけで Reach の順位が再現されるかは ???（seed 1 の取り直し〔10-26〕の後に書く。表 4.15）。第1層は学習を要さず、所要時間は数秒である。同じ結論を学習で得るには 200 エポック（約 8.5 時間）を要する。 表 4.15: 第1層の幾何診断と、学習後に判明した実際の順位の対応 総合判定と実測の一致は ???（旧い物理の値だったので外した。今の物理の結果で書く）。 第…",""],["修論 4.5.2","section","4.5.2 助言に従わせる閉ループの構成",147,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:312","検証は次の手順による。(i) 不適合と判定された形態に診断をかけ、修正指針を得る。(ii) 指針が指定する操作を機械的に適用した形態を生成する。(iii) 生成した形態に同じ診断をかけ、判定が覆るかを見る。(iv) さらに同一条件で学習を実行し、タスクが実際に達成されるかを見る。 指針の適用は人手の判断を挟まず機械的に行う。第1層が返す指針は「腕全体を N 倍に伸ばす」という単一のスカラー操作であり、リンク長のみを一律に倍率倍することで実装できる。カプセル半径・ギア比・目標位置は変更しない。",""],["修論 4.5.3","section","4.5.3 閉ループが検出した指針の欠陥",147,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:318","手順 (i)〜(iii) を最短の不適合形態（総リーチ 0.403 m、Reach）に適用したところ、指針に従って生成した形態が同じ診断に再び却下された。必要な倍率 1.9846 を四捨五入して「1.98 倍以上」と返しており、従うと 2 mm 足りなかった。診断は不適合を正しく検出しており、誤っていたのは返した指針の実行可能性である。⭐ この種の欠陥は既存の形態に診断をかける検証では現れず、出力を入力へ戻して初めて現れる。現在の実装は倍率を切り上げ、判定を覆す最小の倍率（この形態では 1.99 倍）を返す。",""],["修論 4.5.4","section","4.5.4 指針に従った形態での学習",147,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:322","指針の倍率を適用した形態を、リンク長以外の条件をすべてそろえて学習させた（起動設定の差が形態のみであることを設定の記録で確かめた）。 表 4.18: 指針の倍率で到達タスクが達成できるか（200 エポック） 結果は ???（旧い物理の値だったので外した。今の物理の結果で書く）。これが診断フィードバックの有用性（軸3）の主結果であり、助言を返す機能と、助言に従った形態を再入力する経路とを合わせた閉ループが成立したことを示す。 押しタスクでも、指針の倍率（2.11 倍）を適用した形態を学習させた（表 4.19）。 表 4.19: 指針の倍率で押しタスクが達成できるか（200 エポック） なお本節の結果は、当初の実験を撤回して取り直したものである。当初は形態生成器がリンクの描画長のみを倍率倍し関節の取り付け位置を据え…",""],["修論 4.5.5","section","4.5.5 設計を減らす方向 — 閾値が挙げなかった関節の固定",147,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:349","4.5.4 項の助言（腕を N 倍に伸ばす）は設計を増やす方向である。行動診断（第3層）は逆に設計を減らす方向の候補を返す。すなわち可動域の 10 % を下回る使用率の関節について、固定すれば質量と制御の自由度を減らせる可能性を指摘する。この閾値が決めるのは固定を試す候補であり、採否は固定した形態を学習させて成績の範囲の重なりで判断する（3.12.2 節）。したがって閾値の不正確さが生む誤りは、誤った助言の採用ではなく、有効な候補の見落としである。本項は、その見落としが実際に起きることを示す。 対象は手描き線画から生成した 3 関節の形態である。行動診断は、到達タスクでも押しタスクでも、どの関節にも固定を提案しなかった（関節 3 の使用率は ???（seed 1 の取り直し〔10-26〕の後に書く））。 それで…",""],["修論 4.6","section","4.6 軸4: システム全体の統合評価",129,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:370","本節は、4.3 節から 4.5 節までが個別に確かめた工程を結合したシステム全体について、入力から判定・診断までが手戻りなく接続されるかと、一巡に要する時間を評価する。",""],["修論 4.6.1","section","4.6.1 システムとしての接続",153,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:374","提案パイプラインは、生成画像から三次元形状生成・関節の自動検出・リンク分割・パラメータ抽出・シミュレーションモデル生成・学習起動までを接続する。生成されたモデルは学習系にコード変更なしで受理され（4.3.1）、初期動作検証を通過した。さらに同一のパイプラインが生成した形態集合に対して判定が成立し（4.4.3.1 節）、タスクを変えたときに最良形態の順位が入れ替わるかは ???（seed 1 の取り直し〔10-26〕の後に書く）（4.4.3.2）。 接続した形態に対して妥当な判定が得られ、その判定が利用者への修正指針まで到達する（4.5 節）。この接続が研究の寄与としてどう位置づくかは 5.3 節で述べる。",""],["修論 4.6.2","section","4.6.2 検証サイクルの所要時間",153,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:380","システムを一巡させるのに要する時間を表 4.20 に示す。 📝 執筆メモ（本文に残さない）: 2026-10-22: 表の所要時間は実在の物理の横型 13 本の実測（1 エポック 2.49〜2.67 分、2 本並列、系譜 9-284）。「30 エポック」という判定則そのものは 4.6.3 の書き直し（Bug 76 の扱いが決まってから）で見直す。 表 4.20: 検証サイクルの内訳（本研究の計算環境） 学習を要しない工程は合計で数秒に収まる。すなわち幾何的に不適合な形態は、学習を実行することなく即座に棄却して修正指針を返せる。所要時間を支配するのは判定の学習であり、これは 4.6.3 節で扱った通り候補間の隔たりに依存する。",""],["修論 4.6.3","section","4.6.3 R4: 判定に要する学習量の較正",153,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:398","判定が正しくても、1 件あたりに長時間を要するのでは設計案を試行錯誤する用途に適わない。本項は、複数候補の最終順位が確定するまでに要する学習量を較正する。 📝 執筆メモ（本文に残さない）: 本項の較正結果（6 対・27 エポック・約 4 時間・「第 26 エポックまで短腕が上」）は旧い物理の値。実在の物理の R4 は系譜 9-284（全組。第 30 エポックの順位は 17 組すべてで最終と一致、ただし確定の最長は到達の prox 対 dist seed1 の 53。⛔ 9-279 の「1〜26」は漏れ。1 エポック約 2.6 分で 30 エポック ≒ 1.3 時間）。⚠️ seed1 はワーカーの乱数を共有（Bug 76、9-283 A）なので、書き入れはその扱いが決まってから。⛔ 「序盤の値は確信をもって誤る…",""],["修論 4.6.4","section","4.6.4 システムとして未達の項目",153,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:416","紙に描いた線画を入力とする実走を 5 件行い、4 件がモデル生成と幾何診断まで通った。関節は 3 箇所すべてが自動検出され、生成された XML は公称リーチと実効リーチが一致した。幾何診断は 3 件を到達可能、1 件を到達不能と判定している。通らなかった 1 件は斜め上方から描いたもので、三次元形状生成が腕を水平に倒し、関節の高さを境界とするリンク分割が成立しなかった。同じ入力で 2 回再試行しても同じ失敗となったため、入力の視点に由来する系統的な制約である。また同一意図の線画でも総リーチに差が生じており、閾値付近では前段のばらつきが判定を反転させうる。 ただし本節が要求する水準には達していない。 - 実走は 5 件であり、成功率として報告できる件数ではない - 線画は生成 AI が出力した参照画を人が模写した…",""],["修論 4.7","section","4.7 実証題材への適用: エアホッケーの打ち込み",129,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:429","到達・押しの各タスクは、卓上エアホッケーから抽象化したものである（1.3 節）。本節では抽象化を戻し、毎回異なる位置に置かれたパックを、障害物を避けてゴールへ打ち込むタスクをシステムに与える。到達・押しに対して、対象の位置が分布を持つこと、壁での反射を利用できること、目標への直線上に障害物があることの 3 点が加わる。",""],["修論 4.7.1","section","4.7.1 ロボットと台",158,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:433","ロボットは、先端を円盤状のマレットとして描いた手描きスケッチから、パイプラインが生成した縦型 4 関節アームである（台座の柱 0.193 m の上に、鉛直軸の関節 1 つと水平軸の関節 3 つ。リンク長 0.295 / 0.331 / 0.224 m）。設計変数は表 4.1 の量に、縦平面内でのリンクの向きと長さ（設計長の 0.5〜2.93 倍）を加えたものである。台の構成を表 4.25 に示す。 表 4.25: エアホッケー台の構成 本研究の物理エンジンは反発係数を扱わないため（5.3 節 (C)）、壁と板でのパックの反射は、法線方向の速度を反転して 0.75（実物の台の壁の 0.6〜0.8 の範囲）を掛ける速度反射として与えた。腕のリンクは壁と板を通り抜けないようにした。",""],["修論 4.7.2","section","4.7.2 報酬と学習条件",158,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:449","報酬は、パックとゴール点 (1.55, 0) の距離 $d$ に基づくポテンシャル $\\phi = 1/(1+d)$ の差分だけとし、先端をパックへ近づける整形項は置かない。1 試行で得られる報酬の上限は約 0.5 である。押しタスクの報酬（キューブの前進速度）と異なり、対象を特定の点へ運ぶことを求める。 制御コストは 0 とする。他のタスクと同じ水準の係数では、探索中の制御コストが、学習初期にパックへ当たって得られる報酬の 10 倍を超え、腕を動かさない方策が最適になるためである。またゴール口の半幅 0.35 m と初期 y の幅 ±0.25 m は、当初の仕様（0.15 m、±0.40 m）より緩めてある。学習は 200 エポック、2 シードとし、その他の設定は 4.1 節に従う。",""],["修論 4.7.3","section","4.7.3 結果",158,"docs/研究応用/修論ドラフト/第4章_実験および評価.md:455","最良チェックポイント（シード 0、best exec_R_eps ???）の方策を決定的な行動で 20 試行再生し、パックがゴールの口へ入った試行を数えた。開始時の重なりの解消でパックが弾き出される場合を打撃と区別するため、開始時にパックが全リンクから 0.10 m 以上離れていた試行を対象とし、条件を満たした試行の数は ???。結果を表 4.26 に示す（???: 表と本文はホッケーの取り直し〔10-26〕の後に書く）。 表 4.26: 打ち込みの結果（シード 0、20 試行） ゴールの仕方は ???。 結論は ???。緩めた条件と制御コスト 0 の下での結果であり、当初の仕様と、現実的な出力の範囲での達成は確かめていない（5.3 節 (A)）。 📝 執筆メモ（本文に残さない）: 系譜 9-263 ⑩（hoc…",""],["修論 第5章","chapter","第5章 結論",2,"docs/研究応用/修論ドラフト/第5章_結論.md:1","⛔⛔ 2026-10-13（系譜 9-246）: 結果の数値と主張は旧い物理（撤回、5.3 節 (C)）のもの。全実験を実在の値（第4章 表 4.2）で取り直しており、D-6 で差し替える。 ドラフト管理: 初稿 2026-07-16 → v2 2026-07-22（研究スコープの宣言を明確化）→ v3 2026-08-07（査読フィードバック反映: RQ 形式への統一・結論章からの新規データ排除・限界のカテゴリ再構成） → v4 2026-08-07（主軸を「システムの実現」へ変更。RQ をシステム→エンジン→フィードバックの順に組み直し、6.2 の先頭をシステムの成立に）。 ---",""],["修論 5.1","section","5.1 研究目的の達成",162,"docs/研究応用/修論ドラフト/第5章_結論.md:10","本研究は、ハードウェアの専門知識を持たない開発者が、手描きスケッチから出発してロボット形態のタスク適性をシミュレーション上で検証できる環境を構築することを目的とし、次の 3 つのリサーチクエスチョンを設定した。 1. RQ1（システムの成立）: スケッチに由来する形態について、モデル生成から適性判定、不適合であった場合の修正指針の提示までを、専門知識を要さない形で接続できるか 2. RQ2（検証エンジンの妥当性）: 中核に据えた形態-制御 co-design は、タスクの要求に照らして形態を正しく順序づけ、かつそれを返すのにどれだけの学習量を要するか 3. RQ3（フィードバックの有用性）: システムが返す修正指針は、設計のやり直しに実際に使えるか ⭐ 最大の結論は RQ1 に対するものである。生成 AI が出…",""],["修論 5.2","section","5.2 主要な結論",162,"docs/研究応用/修論ドラフト/第5章_結論.md:22","",""],["修論 5.2.1","section","5.2.1 スケッチから適性判定までを通すシステムが成立した",164,"docs/研究応用/修論ドラフト/第5章_結論.md:24","関節マーカー規約に基づく画像から、三次元形状生成・関節検出・リンク分割・モデル生成・学習起動・適性判定・修正指針の提示までが接続された（第3章、第4章 4.3〜4.6 節）。RQ1 に対しては、スケッチ由来の形態をシミュレーション上で評価するシステムを構築できたと結論づける。⚠️ ただし前段の生成は決定的ではなく、外部サービスの取得には人手が残る（5.3 節 (B)）。",""],["修論 5.2.2","section","5.2.2 判定に必要な入力は形態の中核要素のみである",164,"docs/研究応用/修論ドラフト/第5章_結論.md:28","判定が要求する入力は、リンクの本数・長さの比・関節位置と関節軸の割り当てに限られる。質量・材料・アクチュエータの型番・部材の断面形状は与えていない。それでもタスクによって最良形態の順位が入れ替わるか（4.4.3.2 節）と、幾何診断が同一の出力を返す形態対に順序が付くか（4.4.3.3 節）は ???（seed 1 の取り直し〔10-26〕の後に書く）、三層診断の総合判定と実測の一致は ???（旧い物理の値だったので外した。今の物理の結果で書く）。⭐ したがって判定は線画を一枚描いた時点に置ける。本手法の位置は「線画と精密設計の間」ではなく「線画の直後」であり、⚠️ 細部の動力学が判定にほとんど入らないことはその裏面である（5.3 節 (C)、5.4 節 7）。",""],["修論 5.2.3","section","5.2.3 検証エンジンはタスクに適した形態を識別する",164,"docs/研究応用/修論ドラフト/第5章_結論.md:32","タスクのみを変えたときに収束形態が分かれるかを、スケッチ由来の縦型 4 関節アームで調べた（各 2 シード、4.4.2 節）。両タスクとも学習は成立した。ギア比とリンク長の合計がタスクで分かれるかは ???（seed 1 の取り直し〔10-26〕の後に書く）。",""],["修論 5.2.4","section","5.2.4 修正指針に従えば不適合は解消するが、その実行可能性は判定の正しさとは独立に壊…",164,"docs/研究応用/修論ドラフト/第5章_結論.md:36","診断が返した拡大倍率を適用したときの到達タスクの改善は ???（旧い物理の値だったので外した。今の物理の結果で書く）。⭐ ただし助言の実行可能性は判定の正しさとは独立に壊れうる。診断が不適合を正しく検出していたにもかかわらず、助言に従った形態を同じ診断が再び却下し（倍率の丸め方向。4.5.3 節）、是正後には助言どおりに形態を生成する工程にも欠陥が見つかった（4.5.4 節）。いずれも助言を適用した形態を再入力する閉ループを構成して初めて現れた。⭐ 反実仮想的な助言を返すシステムは、出力の正しさとは別に、出力の実行可能性を検証する手順を持たなければならない。",""],["修論 5.3","section","5.3 本研究の位置づけと限界",162,"docs/研究応用/修論ドラフト/第5章_結論.md:40","⭐ 本研究の成果はアルゴリズムの改良ではなく、これまで独立に発展してきた領域を結合した設計支援のシステムである。スケッチからの形状生成、co-design、反実仮想説明に立脚した設計フィードバックはいずれも既存の研究領域に属し、本研究はこれらを専門知識を持たない設計者が概念設計段階で使える一つのパイプラインとして接続した（差分は 2.5 節 表 2.1）。⭐ このシステムにおいて co-design は「最適形態を自動設計する手法」ではなく「形態のタスク適性を判定する検証エンジン」として用いられる。 ⚠️ 本研究の判定はすべてシミュレーション上で行った。物理の値は実在の部材（アルミニウム合金パイプ）と実在のアクチュエータ（UR5e の関節）から導いたが（4.1.1 項）、判定した形態を実機で動かし、シミュレーシ…",""],["修論 5.4","section","5.4 今後の課題",162,"docs/研究応用/修論ドラフト/第5章_結論.md:69","1. 設計空間を実在部材の組み合わせへ離散化する（最も優先度が高い）: 本研究は設計空間の境界を実在部材とアクチュエータの諸元から導き直したが（4.1.1 節）、空間そのものは連続のままである。したがって得られた形態が実在の部品で組み立てられる保証はない。製作可能性を判定しない以上、出力は「製作してよい設計」には届かない（5.3 節）。 この距離を埋める直接的な道筋は、設計空間を連続な数値範囲から実在部品の組み合わせへ置き換えることである。部品ライブラリに基づく組立システム（RobotAssembler 等）は、各部品に質量・慣性・関節軸・可動域・トルク上限を属性として持ち、接続規則を満たす組み合わせのみを生成する。この空間の上で探索すれば、得られた形態は定義上かならず製作可能である。本研究が用いるシミュレータ…",""],["修論 付録A","chapter","付録A M1で使用したプロンプト全文",2,"docs/研究応用/修論ドラフト/付録A_プロンプト全文.md:1","ドラフト管理: 新設 2026-07-22。第3章 3.6節から本文を分離。 2026-09-11 改訂: A.2（手描きスケッチを入力とする版）を追加した。 本論文が報告する end-to-end 実走 5 件はすべて A.2 を用いており、 改訂前の本付録には A.1（ゼロから生成する版）しか収録していなかった。 方針は第3章 3.6 節に記述していたが、全文が無いため実走部分を再現できない状態だった。 本付録は 2 種類のプロンプトを収録する。 A.2 は、各スケッチの実測の比を入れて scripts/make_m1_prompt.py が出力したものを転記した。",""],["修論 A.1","section","A.1 ゼロから生成する版",171,"docs/研究応用/修論ドラフト/付録A_プロンプト全文.md:18","本付録は、第3章 3.6節「M1: 画像整形と関節マーカー規約」で述べた関節マーカー規約を、画像生成 AI（Gemini）に対する固定プロンプトとして課した際の全文である（3関節アームの例）。 text 以下の仕様に従い、3関節ロボットアームを機械設計図スタイルで描いてください。 【形状・姿勢 — 最重要】 - 固定台座から垂直に伸びるシリアルチェーンアーム（根元が下・先端が上） - リンク1（上腕）: 台座から伸びる中太の円柱カプセル - リンク2（前腕）: 上腕より細く1.5倍長い円柱カプセル - リンク3（先端）: 平たいパドル・へら形状 【関節マーカー — 最重要・省略厳禁】 すべての接続部に、純マゼンタ (FF00FF) の球を1個ずつ描くこと。具体的には以下の3箇所: 1. 台座と上腕（赤）の間 2…",""],["修論 A.2","section","A.2 手描きスケッチを入力とする版",171,"docs/研究応用/修論ドラフト/付録A_プロンプト全文.md:54","第4章 4.6 の end-to-end 実走（A1・A2・A3・B1・B2 の 5 件）はすべて本節のプロンプトを用いた。 A.1 との主な差は次の 4 点である。 ⚠️ 向きの制約は「スケッチに忠実」という最優先事項と衝突しうる。 衝突を残したまま運用すると、 寝た絵を入力したとき寝たまま生成されうる。そのため向きのみを明示的な例外として書く。 以下は A1（リンク長比 2 / 1.7 / 1.1）に対して生成したものである。 比の 3 数値のみが 1 枚ごとに変わり、他の全文は共通である。 text 添付した手描きスケッチのロボットアームを、下記の仕様に従って 機械設計図スタイルの画像に描き直してください。 【最優先: スケッチの構造を保つこと】 - リンクの本数、各リンクの長さの比、関節の位置は、スケッ…",""],["修論 付録D","chapter","付録D 再現情報と補足実験",2,"docs/研究応用/修論ドラフト/付録D_再現情報と補足実験.md:1","⛔⛔ 2026-10-13（系譜 9-246）: 結果の数値と主張は旧い物理（撤回、5.3 節 (C)）のもの。全実験を実在の値（第4章 表 4.2）で取り直しており、D-6 で差し替える。 ドラフト管理: 新設 2026-09-30。⭐ 再現に要るが「なぜこの値か」の根拠ではないものを本文から移した。 基準は 50ページ化計画_2026-09-28.md §9。",""],["修論 D.1","section","D.1 学習ハイパーパラメータ",174,"docs/研究応用/修論ドラフト/付録D_再現情報と補足実験.md:8","全実験に共通する設定であり、原論文の公開実装の既定値である。 表 D.1: 学習ハイパーパラメータ（全実験共通）",""],["修論 D.2","section","D.2 実装環境と外部の生成サービス",174,"docs/研究応用/修論ドラフト/付録D_再現情報と補足実験.md:36","ホスト OS は Ubuntu 24.04.4 LTS、Python 3.12.3 上に構築した。M3・M4（メッシュ処理・パラメータ抽出）には trimesh 4.12.2 を用い、M6（co-design 学習）の方策・価値ネットワークは PyTorch 2.7.0（CUDA 12.8 ビルド）、数値計算は NumPy 2.4.6 である。物理シミュレーションには Choreonoid 2.3（AIST シミュレータ）を用い、M5 で生成した MuJoCo 互換 XML を内部形式へ変換して実行する。設定管理には Hydra を用いる。 外部の生成サービス（M1 の Gemini、M2 の Tripo3D）は、実験によって実行の仕方が異なる（表 D.2）。M1 の固定プロンプトの全文は付録A に示す。 表 …",""],["修論 D.3","section","D.3 設計空間の境界の導き方",174,"docs/研究応用/修論ドラフト/付録D_再現情報と補足実験.md:50","表 4.2 の値のうち、導出を要するものを示す。 最大トルクの下限: 縦型 4 関節アームでは、根本関節の自重トルクと押しトルクの和 19.9 N·m の 1.25 倍として 25 N·m とした。水平アームは、配分を変えた形態対（4.4.3.3 節、腕の質量 1.311 kg）について自重トルク 4.84 N·m と押しトルク 11.74 N·m の和 16.58 N·m の 1.25 倍として 20 N·m とし、水平アームに共通に用いる。押しトルクは実機の床の摩擦（係数 0.5）でキューブ 2.7 kg を押す場合の値である。シミュレーションのキューブは床から浮いており床との摩擦を持たず、スライドの粘性だけで減速する。したがってこの下限はシミュレーションの中で必要なトルクではなく、実機で押せる範囲に設計空…",""],["修論 D.4","section","D.4 判定所要学習量の較正データ",174,"docs/研究応用/修論ドラフト/付録D_再現情報と補足実験.md:58","4.6.3 項の較正に用いたデータを示す。 コホートA: 同一条件・別シードのペア（差が乱数のみに帰着する、最も判別の難しい場合。到達、200 エポック） （最終値はシード 0 / シード 1 の best exec_R_eps。空欄: dist は台座への食い込み（Bug 72）を防いだ条件で取り直し中。系譜 9-269） コホートB: 形態が異なる対（4.4.3 節の形態。到達・押し、200 エポック） 「2 シードの帯が離れるエポック」は、running best の 2 シードの範囲が最終の向きで離れ、以後最後まで重ならない最小のエポック（4.2.2 節の判定の単位）。（空欄: 短腕と先端重の取り直しの完走後に計算する。系譜 9-269） コホートC: 3 形態の同時比較（マトリクスの各列）: （空欄:…",""],["想定問答 Q1","qa","Q1 「Pus const KIND = { root: '研究の問い', hub: '台帳', theme: '主題', finding: '知見', retracted: '取り下げ', chapter: '修論の章',
  section: '修論の節', qa: '想定問答', ledger: '系譜の段', bug: 'Bug' };
const N = D.nodes.map(([id, kind, label, parent, src, text, flag], i) => ({ i, id, kind, label, parent, src, text, flag }));
const kids = N.map(() => []);
N.forEach(n => { if (n.parent >= 0) kids[n.parent].push(n.i); });
const adj = N.map(() => []);
D.edges.forEach(([a, b, w]) => { adj[a].push([b, w]); adj[b].push([a, w]); });
const anc = N.map(n => { const out = []; let p = n.parent; while (p >= 0) { out.push(p); p = N[p].parent; } return out; });
const desc = N.map(() => 0);
N.forEach(n => anc[n.i].forEach(a => desc[a]++));
const ROOT = 0;
const INITIAL = () => new Set([ROOT, ...kids[ROOT]]);
let expanded = INITIAL();
let selected = ROOT;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const kcolor = n => css('--k-' + (n.flag === 'retracted' ? 'retracted' : n.kind));
const visible = i => anc[i].every(a => expanded.has(a));
const rep = i => { if (visible(i)) return i; for (const a of anc[i]) if (visible(a)) return a; return ROOT; };

const nodesDS = new vis.DataSet();
const edgesDS = new vis.DataSet();
const net = new vis.Network(document.getElementById('net'), { nodes: nodesDS, edges: edgesDS }, {
  physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -60, springLength: 70, avoidOverlap: 0.3 },
    stabilization: { iterations: 160 } },
  interaction: { hover: true, tooltipDelay: 250 },
  nodes: { shape: 'dot', scaling: { min: 6, max: 34, label: { enabled: true, min: 10, max: 18, drawThreshold: 7 } } },
  edges: { smooth: false, selectionWidth: 1.5 },
});

function nodeView(i) {
  const n = N[i];
  const closed = kids[i].length && !expanded.has(i);
  const c = kcolor(n);
  return {
    id: i, value: n.kind === 'root' ? 40 : closed ? 6 + Math.sqrt(desc[i]) * 2.2 : n.kind === 'hub' ? 16 : 5 + Math.sqrt(adj[i].length),
    label: closed ? `${n.label}  +${desc[i]}` : n.label,
    title: `${KIND[n.kind]} ${n.id}`,
    shape: n.kind === 'root' ? 'diamond' : 'dot',
    borderWidth: closed ? 3 : 1,
    shapeProperties: { borderDashes: n.flag === 'retracted' ? [3, 3] : false },
    color: { background: closed ? css('--panel') : c, border: c, highlight: { background: c, border: css('--ink') },

    font: { color: css('--ink'), face: 'Zen Kaku Gothic New', strokeWidth: 3, strokeColor: css('--bg') },
  };

function render(focusIds) {
  const vis_ = N.filter(n => visible(n.i)).map(n => n.i);
  const set = new Set(vis_);
  const pos = net.getPositions();
  nodesDS.remove(nodesDS.getIds().filter(id => !set.has(id)));
  const add = [];
  vis_.forEach(i => {
    const v = nodeView(i);
    if (!nodesDS.get(i)) {
      const p = pos[rep(N[i].parent >= 0 ? N[i].parent : i)] || { x: 0, y: 0 };
      v.x = p.x + (Math.random() - .5) * 60; v.y = p.y + (Math.random() - .5) * 60;
    }
    add.push(v);
  });
  nodesDS.update(add);
  const E = [];
  vis_.forEach(i => { if (N[i].parent >= 0) E.push({ id: 't' + i, from: N[i].parent, to: i, color: { color: css('--tree') }, width: 1 }); });
  const agg = new Map();
  D.edges.forEach(([a, b, w]) => {
    const ra = rep(a), rb = rep(b);
    if (ra === rb || anc[ra].includes(rb) || anc[rb].includes(ra)) return;
    const k = ra < rb ? ra + '-' + rb : rb + '-' + ra;
    agg.set(k, (agg.get(k) || 0) + w);
  });
  agg.forEach((w, k) => {
    const [a, b] = k.split('-').map(Number);
    E.push({ id: 'c' + k, from: a, to: b, width: Math.min(1 + Math.log2(w), 7), title: `つながり ${w}`,
      color: { color: css('--edge'), highlight: css('--accent'), hover: css('--accent') } });
  });
  edgesDS.clear(); edgesDS.add(E);
  net.setOptions({ physics: { enabled: true } });
  net.stabilize(140);
  if (focusIds) setTimeout(() => net.focus(focusIds, { scale: Math.max(net.getScale(), 0.9), animation: { duration: 500 } }), 350);
}

function reveal(i) {
  anc[i].forEach(a => expanded.add(a));
  render(i);
  select(i);
  net.selectNodes([i]);
}
function toggle(i) {
  if (!kids[i].length) return;
  if (expanded.has(i)) {
    expanded.delete(i);
    N.forEach(n => { if (anc[n.i].includes(i)) expanded.delete(n.i); });
  } else expanded.add(i);
  render(i);
}

const el = (tag, attrs = {}, ...ch) => {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => k === 'style' ? e.setAttribute('style', v) : (e[k] = v));
  ch.flat().forEach(c => e.append(c));
  return e;
};
function item(j, w) {
  const n = N[j];
  const a = el('a', { tabIndex: 0, title: `${KIND[n.kind]} ${n.id}` },
    el('span', { className: 'dot', style: `--c:${kcolor(n)}` }), el('span', { className: 't', textContent: n.label }));
  if (w) a.append(el('span', { className: 'w', textContent: w }));
  a.onclick = () => reveal(j);
  a.onkeydown = e => { if (e.key === 'Enter') reveal(j); };
  return el('li', {}, a);
}

function select(i) {
  selected = i;
  const n = N[i], P = document.getElementById('panel');
  P.replaceChildren();
  P.append(el('div', {}, el('span', { className: 'kind', style: `--c:${kcolor(n)}`, textContent: KIND[n.kind] }),

  if (anc[i].length) {
    const c = el('div', { className: 'crumbs' });
    [...anc[i]].reverse().forEach(a => { const x = el('a', { href: '#', textContent: N[a].label }); x.onclick = e => { e.preventDefault(); reveal(a); }; c.append(x, ' › '); });
    P.append(c);
  }
  P.append(el('h2', { textContent: n.kind === 'root' ? D.question : n.label }));
  if (n.text && n.kind !== 'root') P.append(el('p', { textContent: n.text }));
  if (n.src) P.append(el('div', { className: 'src', textContent: n.src }));
  if (kids[i].length) {
    const b = el('button', { type: 'button', textContent: expanded.has(i) ? '枝をたたむ' : `枝を広げる（${desc[i]}）`, style: 'margin-top:10px' });

    const cnt = {}; N.forEach(m => cnt[m.kind] = (cnt[m.kind] || 0) + 1);

    ['finding', 'retracted', 'section', 'qa', 'ledger', 'bug'].forEach(k => s.append(el('span', { textContent: KIND[k] }), el('span', { textContent: cnt[k] || 0 })));

      el('p', { className: 'note', textContent: '白抜きの丸はたたんだ主題で、押すと中の知識が開きます。線の太さは、本文の中で互いの識別子（系譜 9-285・Bug 76・修論 4.4.3.1・Q14）を書いている回数です。灰色の細い線は幹（どの主題に属すか）です。' }),
      el('p', { className: 'note', textContent: '線は「本文に出てくる」ことだけを表し、支えているのか反証しているのかは区別していません。中身は右下の出どころ（ファイル:行）で読んでください。' }),
      el('p', { className: 'note', textContent: `生成 ${D.generated}。md を変えたら scripts/knowledge_graph.py で作り直します。` }));
  }
  const nb = adj[i].slice().sort((a, b) => b[1] - a[1] || N[a[0]].kind.localeCompare(N[b[0]].kind));
  if (nb.length) {
    P.append(el('h3', { textContent: `つながり（${nb.length}）` }));
    const by = {};
    nb.forEach(([j, w]) => (by[N[j].kind] = by[N[j].kind] || []).push([j, w]));
    Object.entries(by).forEach(([k, v]) => {
      P.append(el('div', { className: 'note', textContent: `${KIND[k]} ${v.length}`, style: 'margin-top:6px' }));
      P.append(el('ul', { className: 'list' }, v.slice(0, 40).map(([j, w]) => item(j, w > 1 ? '×' + w : ''))));
    });
  }
  if (kids[i].length && n.kind !== 'root') {
    P.append(el('h3', { textContent: `中身（${kids[i].length}）` }));
    P.append(el('ul', { className: 'list' }, kids[i].slice(0, 80).map(j => item(j))));
  }
}

net.on('click', e => {
  if (!e.nodes.length) return;
  const i = e.nodes[0];
  if (kids[i].length && !expanded.has(i)) toggle(i);
  select(i);
});

const S = document.getElementById('search');
S.addEventListener('input', () => {
  const q = S.value.trim().toLowerCase();
  if (!q) { select(selected); return; }
  const hits = N.filter(n => n.kind !== 'hub' && (n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q) || n.text.toLowerCase().includes(q)))
    .sort((a, b) => (b.id.toLowerCase().endsWith(q) - a.id.toLowerCase().endsWith(q)) || (b.label.toLowerCase().includes(q) - a.label.toLowerCase().includes(q)));
  const P = document.getElementById('panel');
  P.replaceChildren(el('h3', { textContent: `「${S.value}」に合うもの（${hits.length}）`, style: 'margin-top:0' }),
    el('ul', { className: 'list' }, hits.slice(0, 60).map(n => item(n.i))));
});
S.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = document.querySelector('#panel ul.list a');
  if (first) first.click();
});
document.getElementById('reset').onclick = () => { expanded = INITIAL(); S.value = ''; render(); select(ROOT); setTimeout(() => net.fit({ animation: { duration: 400 } }), 400); };

document.getElementById('question').textContent = D.question;
const L = document.getElementById('legend');
['finding', 'retracted', 'section', 'qa', 'ledger', 'bug', 'theme'].forEach(k => L.append(el('span', { style: `--c:var(--k-${k})`, textContent: KIND[k] })));

function recolor() { nodesDS.update(nodesDS.getIds().map(nodeView)); render(); select(selected); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

render();
select(ROOT);
</script>
