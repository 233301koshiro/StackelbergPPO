<title>形態検証研究の知識地図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* 左に地図、右に読む欄。地図は幹（研究の問い→台帳→主題）だけで始め、押すと枝が開く */
:root {
  --bg: #f2f4f6; --panel: #fbfcfd; --ink: #1c2530; --muted: #5b6876; --line: #d6dce2; --accent: #2b5d8a;
  --edge: rgba(43, 93, 138, .28); --tree: rgba(91, 104, 118, .35);
  --k-root: #1c2530; --k-hub: #33414f; --k-theme: #6c7a89; --k-finding: #13806f; --k-retracted: #c0432e;
  --k-chapter: #24508f; --k-section: #3d6fc0; --k-qa: #7b52b8; --k-ledger: #b07a1c; --k-bug: #7a6450;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --panel: #171e26; --ink: #e3e9ef; --muted: #98a6b4; --line: #2a3541; --accent: #7fb0dd;
  --edge: rgba(127, 176, 221, .26); --tree: rgba(152, 166, 180, .3);
  --k-root: #e3e9ef; --k-hub: #c9d3dc; --k-theme: #8d9cab; --k-finding: #3cc2a9; --k-retracted: #ee7a62;
  --k-chapter: #6f9ee6; --k-section: #8db4f0; --k-qa: #b493e8; --k-ledger: #e0a94a; --k-bug: #b9a089;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #171e26; --ink: #e3e9ef; --muted: #98a6b4; --line: #2a3541; --accent: #7fb0dd;
  --edge: rgba(127, 176, 221, .26); --tree: rgba(152, 166, 180, .3);
  --k-root: #e3e9ef; --k-hub: #c9d3dc; --k-theme: #8d9cab; --k-finding: #3cc2a9; --k-retracted: #ee7a62;
  --k-chapter: #6f9ee6; --k-section: #8db4f0; --k-qa: #b493e8; --k-ledger: #e0a94a; --k-bug: #b9a089;
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; }
.app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.q { color: var(--muted); font-size: 13px; flex: 1 1 260px; min-width: 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); width: 220px; max-width: 60vw; }
button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; display: flex; min-height: 0; }
.map { flex: 1; position: relative; min-width: 0; }
#net { position: absolute; inset: 0; }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; display: flex; flex-wrap: wrap;
  gap: 4px 12px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--bg) 85%, transparent);
  padding: 6px 10px; border-radius: 6px; max-width: calc(100% - 24px); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  background: var(--c); margin-right: 5px; vertical-align: 0; }
aside { width: 380px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto;
  padding: 16px 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.kind { display: inline-block; font-size: 11px; letter-spacing: .06em; padding: 1px 8px; border-radius: 999px;
  color: var(--panel); background: var(--c); }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--k-retracted);
  color: var(--k-retracted); margin-left: 6px; }
.id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: 8px; }
aside h2 { font-size: 16px; margin: 8px 0 6px; line-height: 1.5; text-wrap: balance; }
aside h3 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; font-weight: 700; }
aside p { margin: 0 0 8px; }
.src { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }
.crumbs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 4px; }
.crumbs a { color: var(--muted); }
ul.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
ul.list a { display: flex; gap: 8px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 3px 6px;
  border-radius: 4px; cursor: pointer; }
ul.list a:hover { background: var(--bg); }
ul.list .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(-1px); }
ul.list .t { min-width: 0; overflow-wrap: anywhere; }
ul.list .w { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); }
@media (max-width: 760px) {
  main { flex-direction: column; }
  .map { flex: none; height: 58vh; }
  aside { width: auto; border-left: none; border-top: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>

<div class="app">
  <header>
    <h1>形態検証研究の知識地図</h1>
    <div class="q" id="question"></div>
    <div class="tools">
      <input type="search" id="search" placeholder="9-285・Bug 76・Q14・4.4.3 など" aria-label="ノードを探す">
      <button id="reset" type="button">はじめの形に戻す</button>
    </div>
  </header>
  <main>
    <div class="map"><div id="net"></div><div class="legend" id="legend"></div></div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

<script>
const D = /*DATA*/null;
const KIND = { root: '研究の問い', hub: '台帳', theme: '主題', finding: '知見', retracted: '取り下げ', chapter: '修論の章',
  section: '修論の節', qa: '想定問答', ledger: '系譜の段', bug: 'Bug' };
const N = D.nodes.map(([id, kind, label, parent, src, text, flag], i) => ({ i, id, kind, label, parent, src, text, flag }));
const kids = N.map(() => []);
N.forEach(n => { if (n.parent >= 0) kids[n.parent].push(n.i); });
const adj = N.map(() => []);
D.edges.forEach(([a, b, w]) => { adj[a].push([b, w]); adj[b].push([a, w]); });
const anc = N.map(n => { const out = []; let p = n.parent; while (p >= 0) { out.push(p); p = N[p].parent; } return out; });
const desc = N.map(() => 0);
N.forEach(n => anc[n.i].forEach(a => desc[a]++));
const ROOT = 0;
const INITIAL = () => new Set([ROOT, ...kids[ROOT]]);
let expanded = INITIAL();
let selected = ROOT;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const kcolor = n => css('--k-' + (n.flag === 'retracted' ? 'retracted' : n.kind));
const visible = i => anc[i].every(a => expanded.has(a));
const rep = i => { if (visible(i)) return i; for (const a of anc[i]) if (visible(a)) return a; return ROOT; };

const nodesDS = new vis.DataSet();
const edgesDS = new vis.DataSet();
const net = new vis.Network(document.getElementById('net'), { nodes: nodesDS, edges: edgesDS }, {
  physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -60, springLength: 70, avoidOverlap: 0.3 },
    stabilization: { iterations: 160 } },
  interaction: { hover: true, tooltipDelay: 250 },
  nodes: { shape: 'dot', scaling: { min: 6, max: 34, label: { enabled: true, min: 10, max: 18, drawThreshold: 7 } } },
  edges: { smooth: false, selectionWidth: 1.5 },
});

function nodeView(i) {
  const n = N[i];
  const closed = kids[i].length && !expanded.has(i);
  const c = kcolor(n);
  return {
    id: i, value: n.kind === 'root' ? 40 : closed ? 6 + Math.sqrt(desc[i]) * 2.2 : n.kind === 'hub' ? 16 : 5 + Math.sqrt(adj[i].length),
    label: closed ? `${n.label}  +${desc[i]}` : n.label,
    title: `${KIND[n.kind]} ${n.id}`,
    shape: n.kind === 'root' ? 'diamond' : 'dot',
    borderWidth: closed ? 3 : 1,
    shapeProperties: { borderDashes: n.flag === 'retracted' ? [3, 3] : false },
    color: { background: closed ? css('--panel') : c, border: c, highlight: { background: c, border: css('--ink') },
      hover: { background: c, border: css('--ink') } },
    font: { color: css('--ink'), face: 'Zen Kaku Gothic New', strokeWidth: 3, strokeColor: css('--bg') },
  };
}

function render(focusIds) {
  const vis_ = N.filter(n => visible(n.i)).map(n => n.i);
  const set = new Set(vis_);
  const pos = net.getPositions();
  nodesDS.remove(nodesDS.getIds().filter(id => !set.has(id)));
  const add = [];
  vis_.forEach(i => {
    const v = nodeView(i);
    if (!nodesDS.get(i)) {
      const p = pos[rep(N[i].parent >= 0 ? N[i].parent : i)] || { x: 0, y: 0 };
      v.x = p.x + (Math.random() - .5) * 60; v.y = p.y + (Math.random() - .5) * 60;
    }
    add.push(v);
  });
  nodesDS.update(add);
  const E = [];
  vis_.forEach(i => { if (N[i].parent >= 0) E.push({ id: 't' + i, from: N[i].parent, to: i, color: { color: css('--tree') }, width: 1 }); });
  const agg = new Map();
  D.edges.forEach(([a, b, w]) => {
    const ra = rep(a), rb = rep(b);
    if (ra === rb || anc[ra].includes(rb) || anc[rb].includes(ra)) return;
    const k = ra < rb ? ra + '-' + rb : rb + '-' + ra;
    agg.set(k, (agg.get(k) || 0) + w);
  });
  agg.forEach((w, k) => {
    const [a, b] = k.split('-').map(Number);
    E.push({ id: 'c' + k, from: a, to: b, width: Math.min(1 + Math.log2(w), 7), title: `つながり ${w}`,
      color: { color: css('--edge'), highlight: css('--accent'), hover: css('--accent') } });
  });
  edgesDS.clear(); edgesDS.add(E);
  net.setOptions({ physics: { enabled: true } });
  net.stabilize(140);
  if (focusIds) setTimeout(() => net.focus(focusIds, { scale: Math.max(net.getScale(), 0.9), animation: { duration: 500 } }), 350);
}
net.on('stabilized', () => net.setOptions({ physics: { enabled: false } }));

function reveal(i) {
  anc[i].forEach(a => expanded.add(a));
  render(i);
  select(i);
  net.selectNodes([i]);
}
function toggle(i) {
  if (!kids[i].length) return;
  if (expanded.has(i)) {
    expanded.delete(i);
    N.forEach(n => { if (anc[n.i].includes(i)) expanded.delete(n.i); });
  } else expanded.add(i);
  render(i);
}

const el = (tag, attrs = {}, ...ch) => {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => k === 'style' ? e.setAttribute('style', v) : (e[k] = v));
  ch.flat().forEach(c => e.append(c));
  return e;
};
function item(j, w) {
  const n = N[j];
  const a = el('a', { tabIndex: 0, title: `${KIND[n.kind]} ${n.id}` },
    el('span', { className: 'dot', style: `--c:${kcolor(n)}` }), el('span', { className: 't', textContent: n.label }));
  if (w) a.append(el('span', { className: 'w', textContent: w }));
  a.onclick = () => reveal(j);
  a.onkeydown = e => { if (e.key === 'Enter') reveal(j); };
  return el('li', {}, a);
}

function select(i) {
  selected = i;
  const n = N[i], P = document.getElementById('panel');
  P.replaceChildren();
  P.append(el('div', {}, el('span', { className: 'kind', style: `--c:${kcolor(n)}`, textContent: KIND[n.kind] }),
    n.flag === 'retracted' ? el('span', { className: 'pill', textContent: '撤回・取り下げ' }) : '',
    n.flag === 'corrected' ? el('span', { className: 'pill', textContent: '解釈を訂正', style: 'border-color:var(--k-ledger);color:var(--k-ledger)' }) : '',
    n.kind !== 'root' ? el('span', { className: 'id', textContent: n.id.replace(/^(hub|索引):?/, '') }) : ''));
  if (anc[i].length) {
    const c = el('div', { className: 'crumbs' });
    [...anc[i]].reverse().forEach(a => { const x = el('a', { href: '#', textContent: N[a].label }); x.onclick = e => { e.preventDefault(); reveal(a); }; c.append(x, ' › '); });
    P.append(c);
  }
  P.append(el('h2', { textContent: n.kind === 'root' ? D.question : n.label }));
  if (n.text && n.kind !== 'root') P.append(el('p', { textContent: n.text }));
  if (n.src) P.append(el('div', { className: 'src', textContent: n.src }));
  if (kids[i].length) {
    const b = el('button', { type: 'button', textContent: expanded.has(i) ? '枝をたたむ' : `枝を広げる（${desc[i]}）`, style: 'margin-top:10px' });
    b.onclick = () => { toggle(i); select(i); };
    P.append(b);
  }
  if (n.kind === 'root') {
    const cnt = {}; N.forEach(m => cnt[m.kind] = (cnt[m.kind] || 0) + 1);
    const s = el('div', { className: 'stats' });
    ['finding', 'retracted', 'section', 'qa', 'ledger', 'bug'].forEach(k => s.append(el('span', { textContent: KIND[k] }), el('span', { textContent: cnt[k] || 0 })));
    s.append(el('span', { textContent: 'つながり' }), el('span', { textContent: D.edges.length }));
    P.append(el('h3', { textContent: 'この地図にあるもの' }), s,
      el('h3', { textContent: '見方' }),
      el('p', { className: 'note', textContent: '白抜きの丸はたたんだ主題で、押すと中の知識が開きます。線の太さは、本文の中で互いの識別子（系譜 9-285・Bug 76・修論 4.4.3.1・Q14）を書いている回数です。灰色の細い線は幹（どの主題に属すか）です。' }),
      el('p', { className: 'note', textContent: '線は「本文に出てくる」ことだけを表し、支えているのか反証しているのかは区別していません。中身は右下の出どころ（ファイル:行）で読んでください。' }),
      el('p', { className: 'note', textContent: `生成 ${D.generated}。md を変えたら scripts/knowledge_graph.py で作り直します。` }));
  }
  const nb = adj[i].slice().sort((a, b) => b[1] - a[1] || N[a[0]].kind.localeCompare(N[b[0]].kind));
  if (nb.length) {
    P.append(el('h3', { textContent: `つながり（${nb.length}）` }));
    const by = {};
    nb.forEach(([j, w]) => (by[N[j].kind] = by[N[j].kind] || []).push([j, w]));
    Object.entries(by).forEach(([k, v]) => {
      P.append(el('div', { className: 'note', textContent: `${KIND[k]} ${v.length}`, style: 'margin-top:6px' }));
      P.append(el('ul', { className: 'list' }, v.slice(0, 40).map(([j, w]) => item(j, w > 1 ? '×' + w : ''))));
    });
  }
  if (kids[i].length && n.kind !== 'root') {
    P.append(el('h3', { textContent: `中身（${kids[i].length}）` }));
    P.append(el('ul', { className: 'list' }, kids[i].slice(0, 80).map(j => item(j))));
  }
}

net.on('click', e => {
  if (!e.nodes.length) return;
  const i = e.nodes[0];
  if (kids[i].length && !expanded.has(i)) toggle(i);
  select(i);
});

const S = document.getElementById('search');
S.addEventListener('input', () => {
  const q = S.value.trim().toLowerCase();
  if (!q) { select(selected); return; }
  const hits = N.filter(n => n.kind !== 'hub' && (n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q) || n.text.toLowerCase().includes(q)))
    .sort((a, b) => (b.id.toLowerCase().endsWith(q) - a.id.toLowerCase().endsWith(q)) || (b.label.toLowerCase().includes(q) - a.label.toLowerCase().includes(q)));
  const P = document.getElementById('panel');
  P.replaceChildren(el('h3', { textContent: `「${S.value}」に合うもの（${hits.length}）`, style: 'margin-top:0' }),
    el('ul', { className: 'list' }, hits.slice(0, 60).map(n => item(n.i))));
});
S.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = document.querySelector('#panel ul.list a');
  if (first) first.click();
});
document.getElementById('reset').onclick = () => { expanded = INITIAL(); S.value = ''; render(); select(ROOT); setTimeout(() => net.fit({ animation: { duration: 400 } }), 400); };

document.getElementById('question').textContent = D.question;
const L = document.getElementById('legend');
['finding', 'retracted', 'section', 'qa', 'ledger', 'bug', 'theme'].forEach(k => L.append(el('span', { style: `--c:var(--k-${k})`, textContent: KIND[k] })));

function recolor() { nodesDS.update(nodesDS.getIds().map(nodeView)); render(); select(selected); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

render();
select(ROOT);
</script>
