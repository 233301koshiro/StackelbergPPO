<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ⭐ デモ用（2026-10-05）: Choreonoid（Qt）で漢字が中国語の字形（Droid Sans Fallback）になるのを防ぐ。
     システムの設定を読んだうえで、日本語の字形のフォントを先頭に置く。demo_cnoid.sh が FONTCONFIG_FILE で指定する -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>IPAexGothic</family><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>IPAexMincho</family><family>Noto Serif CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>IPAGothic</family><family>Noto Sans Mono CJK JP</family></prefer>
  </alias>
</fontconfig>
