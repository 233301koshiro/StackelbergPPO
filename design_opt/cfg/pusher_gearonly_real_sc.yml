# pusher_gearonly_real: 実寸の物理でリンク長を凍結し、ギア比だけ最適化する（実験系譜 9-160）。
#   ⚠️ **pusher_gearonly との差はギア上限（400 → 150）のみ。**密度は XML 側（*_real）。

env_name: pusher
agent_specs:
  batch_design: true
# training parameters
gamma: 0.995
tau: 0.95
policy_specs:
  control_log_std: -0.5

robot_param_scale: 1
skel_transform_nsteps: 5

done_condition:
  max_ang: 60

obs_specs:
  attr: ['depth']
  sim: []
  design: true
  clip_qvel: true
  use_projected_params: true
  use_body_ind: true
max_body_depth: 4

add_body_condition:
  max_nchild: 2

robot:
  param_mapping: sin
  no_root_offset: true
  
  # M2 ablation (2026-07-15): bone_offset を設計変数から外す（リンク長 0.30/0.25 で凍結）。
  # gear のみの貢献度を分離する
  body_params: {}

  joint_params: {}

  geom_params:
    # ⛔ 使っていない: 投入前に `pusher_gearonly_real_nx`（後方延長を外し、太さだけ比例）へ置き換えた（11-27 午後、系譜 9-362）。
    # ⭐ 9-362（2026-11-27、ユーザー「じぶんの研究に明確なミスがあるまま進めたくない」）: 太さと後方延長の範囲を
    #   **リンクの設計長に比例** させる（xml_robot.py の Geom._apply_bone_frac）。比は原論文の公開実装の Pusher
    #   （リンク 0.566 m に size [0.03, 0.10]・ext_start [0, 0.2] m）を縮尺したもの: 0.03/0.566・0.10/0.566・0.2/0.566。
    #   lb・ub は bone_frac が上書きする（残してあるのは元の cfg との差を bone_frac の 2 行に限るため）。
    size:
      lb: 0.03
      ub: 0.10
      bone_frac: [0.0530, 0.1768]
    ext_start:
      lb: 0.0
      ub: 0.2
      bone_frac: [0.0, 0.3536]

  actuator_params:
    gear:
      # ⭐⭐ 9-160: この形態で導出した実在アクチュエータの範囲。
      #   ⚠️ **9-129 の 25〜150 は e2e_a1v 用の値なので流用しない。**形態ごとに計算する。
      #   実効密度 294.2（アルミ・肉厚 2 mm。半径 0.032〜0.045 m の薄肉パイプ）→ 腕 1.311 kg
      #   根元の自重トルク 4.84 ＋ 押しトルク 11.74（cube 2.7 kg・μ=0.5・腕 0.887 m）＝ **16.58 N·m**
      #   ⭐ 下限 = 必要トルクの 1.25 倍 = 20.7 → **20**（旧と同じ）
      #   ⭐ 上限 = **UR5e の関節トルク 150 N·m**（9-129 と同じ機体）
      # ⭐⭐ したがって旧条件との差は **上限 400 → 150 の 1 変数のみ**。
      lb: 20
      ub: 150
  

