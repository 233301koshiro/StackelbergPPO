# pusher_gearonly_real_ub300: pusher_gearonly_real との差はギア比の上限（150 → 300 N·m）だけ（系譜 9-340、読み ㊼、2026-11-06）。
#   第2層の「ギア比が上限に張り付いた＝出力不足」の助言に従って、上限を上げる閉ループ（修論 4.5、想定問答 Q64）。
#   上限は全関節で 1 つの値しか持てない（khrylib/robot/xml_robot.py の Actuator）ので、全関節で上げる。
#   300 は UR5e の関節トルク 150 の 2 倍で、実在の部品の根拠は無い（「より強いモーターを使う」助言を試すための値）。
#   ⚠️ `robot` は yml からしか読まれない（design_opt/utils/config.py の _YML_ONLY）ので、起動行では上書きできない。
# pusher_gearonly_real: 実寸の物理でリンク長を凍結し、ギア比だけ最適化する（実験系譜 9-160）。
#   ⚠️ **pusher_gearonly との差はギア上限（400 → 150）のみ。**密度は XML 側（*_real）。

env_name: pusher
agent_specs:
  batch_design: true
# training parameters
gamma: 0.995
tau: 0.95
policy_specs:
  control_log_std: -0.5

robot_param_scale: 1
skel_transform_nsteps: 5

done_condition:
  max_ang: 60

obs_specs:
  attr: ['depth']
  sim: []
  design: true
  clip_qvel: true
  use_projected_params: true
  use_body_ind: true
max_body_depth: 4

add_body_condition:
  max_nchild: 2

robot:
  param_mapping: sin
  no_root_offset: true
  
  # M2 ablation (2026-07-15): bone_offset を設計変数から外す（リンク長 0.30/0.25 で凍結）。
  # gear のみの貢献度を分離する
  body_params: {}

  joint_params: {}

  geom_params:
    size:
      lb: 0.03
      ub: 0.10
    ext_start:
      lb: 0.0
      ub: 0.2

  actuator_params:
    gear:
      # ⭐⭐ 9-160: この形態で導出した実在アクチュエータの範囲。
      #   ⚠️ **9-129 の 25〜150 は e2e_a1v 用の値なので流用しない。**形態ごとに計算する。
      #   実効密度 294.2（アルミ・肉厚 2 mm。半径 0.032〜0.045 m の薄肉パイプ）→ 腕 1.311 kg
      #   根元の自重トルク 4.84 ＋ 押しトルク 11.74（cube 2.7 kg・μ=0.5・腕 0.887 m）＝ **16.58 N·m**
      #   ⭐ 下限 = 必要トルクの 1.25 倍 = 20.7 → **20**（旧と同じ）
      #   ⭐ 上限 = **UR5e の関節トルク 150 N·m**（9-129 と同じ機体）
      # ⭐⭐ したがって旧条件との差は **上限 400 → 150 の 1 変数のみ**。
      lb: 20
      ub: 300   # ⭐ 9-340: 150 → 300（上のコメントの「上限 150」は元の cfg の根拠）
  

